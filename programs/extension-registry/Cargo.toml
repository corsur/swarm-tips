[package]
name = "extension-registry"
version = "0.1.0"
description = "Extension-credit reputation graph — bonded extension-as-obligation primitive (mund-creanc-witer)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "extension_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
all = "deny"
arithmetic_side_effects = "deny"
