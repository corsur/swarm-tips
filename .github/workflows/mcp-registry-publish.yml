name: Publish MCP Registry Manifests

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which manifest(s) to publish"
        required: false
        type: choice
        options:
          - all
          - swarm-tips
          - shillbot
          - coordination-game
        default: "all"

permissions:
  contents: read
  id-token: write

jobs:
  publish-mcp-registry:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          MCP_PUBLISHER_VERSION="v1.8.16"
          MCP_PUBLISHER_SHA256="6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /usr/local/bin mcp-publisher
          chmod +x /usr/local/bin/mcp-publisher
          rm -f /tmp/mcp-publisher.tar.gz

      - name: Validate manifests
        run: |
          set -euo pipefail
          (cd services/mcp-server && mcp-publisher validate)
          (cd services/mcp-server/registry/shillbot && mcp-publisher validate)
          (cd services/mcp-server/registry/coordination-game && mcp-publisher validate)

      - name: Authenticate via GitHub OIDC and publish
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          mcp-publisher login github-oidc
          publish_dir() {
            local dir="$1"
            echo "=== Publishing $dir/server.json ==="
            (
              cd "$dir"
              mcp-publisher login github-oidc
              mcp-publisher publish server.json
            )
          }
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "swarm-tips" ]; then
            publish_dir "services/mcp-server"
          fi
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "shillbot" ]; then
            publish_dir "services/mcp-server/registry/shillbot"
          fi
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "coordination-game" ]; then
            publish_dir "services/mcp-server/registry/coordination-game"
          fi
