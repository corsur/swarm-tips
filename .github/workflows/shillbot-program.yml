name: Shillbot Program

on:
  push:
    branches: [main]
    paths:
      - 'programs/shillbot/**'
      - 'crates/shared/**'
      - 'tests/shillbot.ts'
      - 'tests/shillbot-lifecycle.ts'
      - 'tests/shillbot-attested.ts'
      - 'tests/shillbot-matrix.ts'
      - 'tests/shillbot-guards.ts'
      - 'tests/harness/**'
      - 'tests/fixtures/task-payout-vectors.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'Anchor.toml'
      - '.github/workflows/shillbot-program.yml'
  pull_request:
    paths:
      - 'programs/shillbot/**'
      - 'crates/shared/**'
      - 'tests/shillbot*.ts'
      - 'tests/harness/**'
      - 'tests/fixtures/task-payout-vectors.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'Anchor.toml'
      - '.github/workflows/shillbot-program.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target cluster (mainnet requires explicitly selecting it)'
        required: true
        default: devnet
        type: choice
        options:
          - devnet
          - mainnet

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      - name: Generate throwaway keypair for local validator
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json

      - name: Build programs
        run: |
          anchor build -p coordination-game
          anchor build -p shillbot
          # extension programs too: `pnpm run lint` runs repo-wide `tsc`, which
          # typechecks tests/extension-*.ts and needs their generated types.
          anchor build -p extension-registry
          anchor build -p extension-credit

      - run: pnpm run lint

      # Bankrun suites run in-process (no validator) — fast, and they include the
      # combinatorial matrix + guards. anchor-bankrun loads the built .so from
      # target/deploy, so the Build step above is the only prerequisite.
      - name: Run bankrun suites (no validator)
        run: npx ts-mocha -p ./tsconfig.json -t 1000000 --exit "tests/shillbot-lifecycle.ts" "tests/shillbot-attested.ts" "tests/shillbot-matrix.ts" "tests/shillbot-guards.ts"

      - name: Start local validator
        run: |
          solana-test-validator \
            --bpf-program 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi target/deploy/shillbot.so \
            --bpf-program 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P target/deploy/coordination_game.so \
            --reset --quiet &
          sleep 5
          solana config set --url localhost --keypair /home/runner/.config/solana/id.json
          solana airdrop 100

      - name: Run validator suite (live-lifecycle)
        run: npx ts-mocha -p ./tsconfig.json -t 1000000 --exit "tests/shillbot.ts"
        env:
          ANCHOR_PROVIDER_URL: http://localhost:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json

      - name: Stop local validator
        if: always()
        run: pkill -f solana-test-validator || true

  deploy-devnet:
    # Auto-upgrade devnet on every merge to main too (not just manual dispatch).
    # Previously dispatch-only, so devnet silently drifted behind mainnet: the
    # a685cdf client-nonce create_task landed + auto-deployed to mainnet but not
    # devnet, and every devnet task-create then failed InstructionDidNotDeserialize
    # against the stale program. Keeping devnet in lockstep with mainnet prevents
    # that class of regression. Same test gate + upgradeable-in-place deploy as mainnet.
    if: >-
      needs.test.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'devnet'))
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - name: Write deploy keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json

      - name: Write program keypairs
        run: |
          mkdir -p target/deploy
          echo '${{ secrets.ANCHOR_PROGRAM_KEYPAIR }}' > target/deploy/coordination_game-keypair.json
          echo '${{ secrets.SHILLBOT_PROGRAM_KEYPAIR }}' > target/deploy/shillbot-keypair.json

      - name: Build programs
        run: |
          anchor build -p coordination-game
          anchor build -p shillbot

      - name: Close orphaned buffer accounts
        run: solana program close --buffers --url devnet --keypair ~/.config/solana/id.json || true

      - name: Close IDL accounts (required when IDL size increases)
        run: |
          anchor idl close --provider.cluster devnet 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P || true
          anchor idl close --provider.cluster devnet 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi || true

      - name: Deploy both programs to devnet
        # Use `solana program deploy` directly instead of `anchor deploy`.
        # Same reason as the matching step in coordination-game.yml: the
        # latter bundles bytecode upload with an idl upgrade that fails on
        # devnet with 0xbc4 / AccountNotInitialized when the on-chain IDL
        # is wedged, AND it allocates a fresh buffer account sized for the
        # full program rent (~4.6 SOL for coord-game, ~4.5 SOL for shillbot)
        # instead of reusing the existing programdata. The 2026-05-09
        # shillbot deploy run failed with "insufficient funds for spend
        # (4.64213208 SOL)" because the upgrade authority (CKsZ7ZM...) had
        # only ~0.88 devnet SOL — anchor was effectively asking for a fresh
        # rent allocation on every push instead of upgrading in place.
        # solana program deploy reuses programdata and only needs buffer
        # rent (~0.07 SOL) which auto-reclaims after upgrade.
        run: |
          solana program deploy \
            --url https://api.devnet.solana.com \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P \
            target/deploy/coordination_game.so
          solana program deploy \
            --url https://api.devnet.solana.com \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi \
            target/deploy/shillbot.so

      - name: Initialize / upgrade on-chain IDL (best effort)
        # Off-chain consumers use the SDK's bundled IDL, not the on-chain
        # copy, so the program runs correctly even if these calls fail.
        run: |
          (anchor idl init --provider.cluster devnet \
            --filepath target/idl/coordination_game.json \
            2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P || \
           anchor idl upgrade --provider.cluster devnet \
            --filepath target/idl/coordination_game.json \
            2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P) || \
          echo "coordination_game IDL update failed; bytecode is the load-bearing step"
          (anchor idl init --provider.cluster devnet \
            --filepath target/idl/shillbot.json \
            2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi || \
           anchor idl upgrade --provider.cluster devnet \
            --filepath target/idl/shillbot.json \
            2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi) || \
          echo "shillbot IDL update failed; bytecode is the load-bearing step"

      - name: Verify program parity across mainnet and devnet
        run: bash scripts/check-program-parity.sh

      - name: Verify upgrade authority (post-deploy)
        run: |
          bash scripts/check-upgrade-authority.sh \
            --cluster devnet \
            --program-id 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P
          bash scripts/check-upgrade-authority.sh \
            --cluster devnet \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi
        env:
          EXPECTED_AUTHORITY_PUBKEY: CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY

  deploy-mainnet:
    # Auto-deploys mainnet on every merge to main that touches the shillbot
    # program, but ONLY after devnet deploys cleanly — the staged pipeline is
    # test -> deploy-devnet -> deploy-mainnet. Manual dispatch with target=mainnet
    # is also allowed (devnet is skipped in that path, hence the `skipped` branch
    # below). The a685cdf silent-failure — an auto-deploy that hit the flaky
    # public RPC and left mainnet on the old program unnoticed — is prevented by
    # the deploy step below: it reads the PREMIUM RPC from GCP and FAILS LOUD
    # (red CI) if the RPC read or deploy fails, never falling back to the public
    # endpoint. Solana programs are upgradeable, so this swaps bytecode in place
    # and preserves all PDA state.
    needs: [test, deploy-devnet]
    # `always()` so the job still evaluates when deploy-devnet is SKIPPED (the
    # dispatch-target=mainnet path); the explicit result checks then require
    # devnet to have SUCCEEDED on the push path and merely be skipped on dispatch.
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.deploy-devnet.result == 'success' ||
       needs.deploy-devnet.result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'mainnet'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the GCP secret read below
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Auth to GCP so the deploy step can read the premium mainnet RPC straight
      # from Secret Manager (single source of truth). The RPC is a runtime secret
      # that already lives in GCP as `solana-rpc-url-mainnet`; per the org
      # standard it must NOT be duplicated into GitHub Secrets (that second copy
      # drifts on rotation). The CI SA (github-actions-ci) holds
      # secretmanager.secretAccessor, so no key value ever transits a human or a
      # GitHub secret.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - name: Write deploy keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json

      - name: Write program keypairs
        run: |
          mkdir -p target/deploy
          echo '${{ secrets.SHILLBOT_PROGRAM_KEYPAIR }}' > target/deploy/shillbot-keypair.json

      - name: Build shillbot only
        run: anchor build -p shillbot

      - name: Close orphaned buffer accounts
        run: solana program close --buffers --url mainnet-beta --keypair ~/.config/solana/id.json || true

      - name: Deploy shillbot to mainnet
        # `solana program deploy` against a PREMIUM RPC, not
        # `anchor deploy --provider.cluster mainnet`. anchor deploy hits the
        # rate-limited public api.mainnet-beta AND allocates a fresh buffer
        # instead of upgrading in place — it silently failed the a685cdf
        # client-nonce upgrade (2026-08-17), leaving mainnet on the pre-nonce
        # program while shillbot-api sends the nonce, so mainnet create_task
        # deserialization breaks. Premium RPC (read from GCP Secret Manager at
        # deploy time via Workload Identity) + in-place upgrade, mirroring the
        # devnet deploy. Fail loudly if the secret can't be read — do NOT fall
        # back to the flaky public RPC, which is what silently broke a685cdf.
        run: |
          MAINNET_RPC="$(gcloud secrets versions access latest --secret=solana-rpc-url-mainnet)"
          if [ -z "$MAINNET_RPC" ]; then
            echo "::error::could not read solana-rpc-url-mainnet from Secret Manager" >&2
            exit 1
          fi
          solana program deploy \
            --url "$MAINNET_RPC" \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi \
            target/deploy/shillbot.so

      - name: Verify upgrade authority (mainnet)
        run: |
          bash scripts/check-upgrade-authority.sh \
            --cluster mainnet-beta \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi
        env:
          EXPECTED_AUTHORITY_PUBKEY: CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY
