name: Shillbot Program

on:
  push:
    branches: [main]
    paths:
      - 'programs/shillbot/**'
      - 'crates/shared/**'
      - 'tests/shillbot.ts'
      - 'tests/shillbot/**'
      - 'tests/shillbot-lifecycle.ts'
      - 'tests/shillbot-attested.ts'
      - 'tests/shillbot-matrix.ts'
      - 'tests/shillbot-guards.ts'
      - 'tests/harness/**'
      - 'tests/fixtures/task-payout-vectors.json'
      - 'scripts/e2e/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'sdk/client/**'
      - 'Anchor.toml'
      - '.github/workflows/shillbot-program.yml'
  pull_request:
    paths:
      - 'programs/shillbot/**'
      - 'crates/shared/**'
      - 'tests/shillbot*.ts'
      - 'tests/shillbot/**'
      - 'tests/harness/**'
      - 'tests/fixtures/task-payout-vectors.json'
      - 'scripts/e2e/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'sdk/client/**'
      - 'Anchor.toml'
      - '.github/workflows/shillbot-program.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Verify only, or explicitly deploy to a cluster after tests pass'
        required: true
        default: test
        type: choice
        options:
          - test
          - devnet
          - mainnet

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list in deploy-base-sha.sh
    outputs:
      program: ${{ steps.filter.outputs.program }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Diff against the last fully successful push run, not the previous
      # push, so a program change whose pipeline failed still deploys once
      # a later commit goes green (see scripts/deploy-base-sha.sh).
      - name: Diff base
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(bash scripts/deploy-base-sha.sh "$GITHUB_WORKFLOW" '${{ github.event.before }}')" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            program:
              - 'programs/shillbot/**'
              - 'crates/shared/**'
              - 'Anchor.toml'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swarm-tips/client build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      - name: Generate throwaway keypair for local validator
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json

      - name: Build programs
        run: |
          anchor build -p coordination-game
          anchor build -p shillbot
          # extension programs too: `pnpm run lint` runs repo-wide `tsc`, which
          # typechecks tests/extension-*.ts and needs their generated types.
          anchor build -p extension-registry
          anchor build -p extension-credit

      - name: Check committed unified-client bindings
        run: pnpm --filter @swarm-tips/client check:generated

      - run: pnpm run lint

      # Bankrun suites run in-process (no validator) — fast, and they include the
      # combinatorial matrix + guards. anchor-bankrun loads the built .so from
      # target/deploy, so the Build step above is the only prerequisite.
      - name: Run bankrun suites (no validator)
        run: pnpm vitest run "tests/shillbot-lifecycle.ts" "tests/shillbot-attested.ts" "tests/shillbot-matrix.ts" "tests/shillbot-guards.ts"

      - name: Start local validator
        run: |
          solana-test-validator \
            --bpf-program 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi target/deploy/shillbot.so \
            --bpf-program 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P target/deploy/coordination_game.so \
            --reset --quiet &
          sleep 5
          solana config set --url localhost --keypair /home/runner/.config/solana/id.json
          solana airdrop 100

      - name: Run validator suite (live-lifecycle)
        run: pnpm vitest run "tests/shillbot.ts"
        env:
          ANCHOR_PROVIDER_URL: http://localhost:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json

      - name: Stop local validator
        if: always()
        run: pkill -f solana-test-validator || true

  deploy-devnet:
    # Staged pipeline: test (bankrun + local validator) -> devnet -> mainnet,
    # automatic on push to main when the program changed. Devnet used to be
    # dispatch-only and silently drifted (a685cdf InstructionDidNotDeserialize).
    # Deploys shillbot ONLY: coordination-game is deployed by its own workflow;
    # deploying both from both workflows raced and could restore stale bytecode.
    if: >-
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.changes.outputs.program == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'devnet'))
    needs: [test, changes]
    runs-on: ubuntu-latest
    # Serialize deploys to a cluster; never cancel one mid-upload.
    concurrency:
      group: shillbot-deploy-devnet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - name: Write deploy keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json

      - name: Write program keypairs
        run: |
          mkdir -p target/deploy
          echo '${{ secrets.SHILLBOT_PROGRAM_KEYPAIR }}' > target/deploy/shillbot-keypair.json

      - name: Build shillbot
        run: anchor build -p shillbot

      - name: Close orphaned buffer accounts
        run: solana program close --buffers --url devnet --keypair ~/.config/solana/id.json || true

      - name: Close IDL account (required when IDL size increases)
        run: anchor idl close --provider.cluster devnet 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi || true

      - name: Extend programdata if the new build is larger
        run: bash scripts/ensure-programdata-len.sh 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi target/deploy/shillbot.so https://api.devnet.solana.com

      - name: Deploy shillbot to devnet
        # `solana program deploy` (in-place upgrade, reuses programdata) instead
        # of `anchor deploy`, which bundles a fragile IDL step and allocates a
        # fresh full-rent buffer (2026-05-09 "insufficient funds" failure).
        run: |
          solana program deploy \
            --url https://api.devnet.solana.com \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi \
            target/deploy/shillbot.so

      - name: Close buffers left by a failed deploy
        if: failure()
        run: solana program close --buffers --url devnet --keypair ~/.config/solana/id.json || true

      - name: Initialize / upgrade on-chain IDL (best effort)
        # Off-chain consumers use the SDK's bundled IDL, not the on-chain copy.
        run: |
          (anchor idl init --provider.cluster devnet \
            --filepath target/idl/shillbot.json \
            2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi || \
           anchor idl upgrade --provider.cluster devnet \
            --filepath target/idl/shillbot.json \
            2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi) || \
          echo "shillbot IDL update failed; bytecode is the load-bearing step"

      - name: Verify upgrade authority (post-deploy)
        run: |
          bash scripts/check-upgrade-authority.sh \
            --cluster devnet \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi
        env:
          EXPECTED_AUTHORITY_PUBKEY: CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY

  deploy-mainnet:
    # Automatic after a successful devnet deploy on push (allowlisted in
    # .github/mainnet-auto-deploy.yml); dispatch target=mainnet also allowed.
    # Solana programs are upgradeable, so this swaps bytecode in place and
    # preserves all PDA state. Premium RPC from GCP Secret Manager; fails loud,
    # never falls back to the public endpoint (a685cdf silent failure).
    needs: [test, changes, deploy-devnet]
    # `always()` so the job evaluates when deploy-devnet is SKIPPED (dispatch
    # target=mainnet); the push path requires devnet SUCCESS.
    if: >-
      always() &&
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.changes.outputs.program == 'true' &&
        needs.deploy-devnet.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'mainnet'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the GCP secret read below
    concurrency:
      group: shillbot-deploy-mainnet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Mainnet allowlist guard
        run: bash scripts/check-mainnet-allowlist.sh 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi
      - uses: dtolnay/rust-toolchain@stable

      # Premium mainnet RPC lives in GCP Secret Manager (`solana-rpc-url-mainnet`)
      # — single source of truth; never duplicated into GitHub Secrets.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - name: Write deploy keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json

      - name: Write program keypairs
        run: |
          mkdir -p target/deploy
          echo '${{ secrets.SHILLBOT_PROGRAM_KEYPAIR }}' > target/deploy/shillbot-keypair.json

      - name: Build shillbot only
        run: anchor build -p shillbot

      - name: Read premium mainnet RPC
        run: |
          MAINNET_RPC="$(gcloud secrets versions access latest --secret=solana-rpc-url-mainnet)"
          if [ -z "$MAINNET_RPC" ]; then
            echo "::error::could not read solana-rpc-url-mainnet from Secret Manager" >&2
            exit 1
          fi
          echo "::add-mask::$MAINNET_RPC"
          echo "MAINNET_RPC=$MAINNET_RPC" >> "$GITHUB_ENV"

      - name: Close orphaned buffer accounts
        run: solana program close --buffers --url "$MAINNET_RPC" --keypair ~/.config/solana/id.json || true

      - name: Extend programdata if the new build is larger
        run: bash scripts/ensure-programdata-len.sh 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi target/deploy/shillbot.so "$MAINNET_RPC"

      - name: Deploy shillbot to mainnet
        run: |
          solana program deploy \
            --url "$MAINNET_RPC" \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi \
            target/deploy/shillbot.so

      - name: Close buffers left by a failed deploy
        if: failure()
        run: solana program close --buffers --url "$MAINNET_RPC" --keypair ~/.config/solana/id.json || true

      - name: Verify upgrade authority (mainnet)
        run: |
          bash scripts/check-upgrade-authority.sh \
            --cluster mainnet-beta \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi
        env:
          EXPECTED_AUTHORITY_PUBKEY: CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY
