name: Proof registry checks

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "proofs/SwarmProofs/**"
      - "proofs/fixtures/**"
      - "crates/proof-registry/**"
      - "crates/xtask/**"
      - "scripts/*proof*"
      - ".github/workflows/proof-registry-*.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "proofs/SwarmProofs/**"
      - "proofs/fixtures/**"
      - "crates/proof-registry/**"
      - "crates/xtask/**"
      - "scripts/*proof*"
      - ".github/workflows/proof-registry-*.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: proof-registry
      - name: Validate canonical registry and frozen library hashes
        run: cargo run --locked -p proof-registry --bin proof-registry -- validate proofs/SwarmProofs/registry.json
      - name: Prepare ephemeral audit umbrella
        run: cargo run --locked -p xtask -- prepare-proof-promotion-audit
      - name: Install pinned Lean environment
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/SwarmProofs
          build: false
          test: false
      - name: Build pinned trusted environment only
        working-directory: proofs/SwarmProofs
        run: lake build Zeta23
      - name: Parse source policy before compiling promoted modules
        run: |
          bash scripts/test-proof-source-policy.sh
          cargo run --locked -p xtask -- check-proof-sources
      - name: Build promoted modules
        working-directory: proofs/SwarmProofs
        run: lake build SwarmProofs PromotionAudit
      - name: Export and independently check promoted declarations
        run: bash scripts/check-proof-nanoda.sh proofs/SwarmProofs PromotionAudit
      - name: Reject omitted helpers, forbidden axioms, and namespace escapes
        run: |
          cargo test --locked -p proof-registry -p xtask
          bash scripts/test-proof-declaration-inventory.sh
      - name: Independently check reusable definition and private helper fixture
        run: bash scripts/check-proof-nanoda.sh proofs/SwarmProofs Reusable proofs/SwarmProofs/.lake/fixture-audit SwarmProofs.Generated.Fixture
      - name: Independently check a second module using the first definition and theorem
        run: bash scripts/check-proof-nanoda.sh proofs/SwarmProofs ReusableConsumer proofs/SwarmProofs/.lake/consumer-audit SwarmProofs.Generated.Consumer
      - name: Independently check statementProp Expr stability and reject tampered statementProp
        run: >-
          bash scripts/check-proof-nanoda.sh
          proofs/SwarmProofs
          StatementStabilityGood
          proofs/SwarmProofs/.lake/stability-audit
          SwarmProofs.Generated.StabilityGood
          proofs/fixtures/StatementStabilityStandalone.lean
          StatementStabilityTampered
          SwarmProofs.Generated.StabilityTampered
      - name: Retain declaration coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: proof-declaration-coverage-${{ inputs.source_sha || github.sha }}
          path: |
            proofs/SwarmProofs/.lake/proof-audit/
            proofs/SwarmProofs/.lake/fixture-audit/
            proofs/SwarmProofs/.lake/consumer-audit/
            proofs/SwarmProofs/.lake/stability-audit/
          if-no-files-found: error
      - name: Audit exported declaration axioms
        run: |
          (cd proofs/SwarmProofs && lake env lean PromotionAudit.lean) 2>&1 | tee /tmp/swarm-proof-axioms.txt
          cargo run --locked -p xtask -- check-proof-axiom-audit /tmp/swarm-proof-axioms.txt proofs/SwarmProofs/registry.json
      - name: Restore non-umbrella public package root
        if: always()
        run: |
          mv proofs/SwarmProofs/lakefile.toml.original proofs/SwarmProofs/lakefile.toml
          rm -f proofs/SwarmProofs/PromotionAudit.lean
      - name: Reject generated drift
        run: git diff --exit-code
