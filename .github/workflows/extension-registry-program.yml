name: Extension Registry Program

on:
  push:
    branches: [main]
    paths:
      - 'programs/extension-registry/**'
      - 'tests/extension-registry.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Anchor.toml'
      - '.github/workflows/extension-registry-program.yml'
  pull_request:
    paths:
      - 'programs/extension-registry/**'
      - 'tests/extension-registry.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Anchor.toml'
      - '.github/workflows/extension-registry-program.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Verify only, or explicitly deploy to a cluster after tests pass'
        required: true
        default: test
        type: choice
        options:
          - test
          - devnet
          - mainnet

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list in deploy-base-sha.sh
    outputs:
      program: ${{ steps.filter.outputs.program }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Diff against the last fully successful push run (scripts/deploy-base-sha.sh).
      - name: Diff base
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(bash scripts/deploy-base-sha.sh "$GITHUB_WORKFLOW" '${{ github.event.before }}')" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            program:
              - 'programs/extension-registry/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt -p extension-registry -- --check
      - run: cargo clippy -p extension-registry --all-targets -- -D warnings

      - name: Generate throwaway keypair for local validator
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json

      - name: Build program
        run: anchor build -p extension-registry

      - name: Start local validator
        run: |
          solana-test-validator \
            --bpf-program H7whziapWzGDH1b3QQzxno69TD4braekyBZhfjNGof4j target/deploy/extension_registry.so \
            --reset --quiet &
          sleep 8
          solana config set --url localhost --keypair /home/runner/.config/solana/id.json
          solana airdrop 100

      - name: Run extension-registry tests
        run: pnpm vitest run "tests/extension-registry.ts"
        env:
          ANCHOR_PROVIDER_URL: http://localhost:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json

      - name: Stop local validator
        if: always()
        run: pkill -f solana-test-validator || true

  deploy-devnet:
    # Staged pipeline: test -> devnet -> mainnet, automatic on push to main when
    # the program changed (mainnet allowlist: .github/mainnet-auto-deploy.yml).
    if: >-
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.changes.outputs.program == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'devnet'))
    needs: [test, changes]
    runs-on: ubuntu-latest
    concurrency:
      group: extension-registry-deploy-devnet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - name: Write deploy + program keypairs
        run: |
          mkdir -p ~/.config/solana target/deploy
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json
          echo '${{ secrets.EXTENSION_REGISTRY_PROGRAM_KEYPAIR }}' > target/deploy/extension_registry-keypair.json

      - name: Build program
        run: anchor build -p extension-registry

      - name: Close orphaned buffer accounts
        run: solana program close --buffers --url devnet --keypair ~/.config/solana/id.json || true

      - name: Extend programdata if the new build is larger
        run: bash scripts/ensure-programdata-len.sh H7whziapWzGDH1b3QQzxno69TD4braekyBZhfjNGof4j target/deploy/extension_registry.so https://api.devnet.solana.com

      - name: Deploy to devnet
        run: |
          solana program deploy \
            --url https://api.devnet.solana.com \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id H7whziapWzGDH1b3QQzxno69TD4braekyBZhfjNGof4j \
            target/deploy/extension_registry.so

      - name: Close buffers left by a failed deploy
        if: failure()
        run: solana program close --buffers --url devnet --keypair ~/.config/solana/id.json || true

      - name: Verify upgrade authority (devnet)
        run: |
          bash scripts/check-upgrade-authority.sh \
            --cluster devnet \
            --program-id H7whziapWzGDH1b3QQzxno69TD4braekyBZhfjNGof4j
        env:
          EXPECTED_AUTHORITY_PUBKEY: CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY

  deploy-mainnet:
    # Automatic on push after devnet succeeds (allowlisted), plus dispatch.
    # Premium RPC from GCP Secret Manager; fails loud, never the public RPC.
    if: >-
      always() &&
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.changes.outputs.program == 'true' &&
        needs.deploy-devnet.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'mainnet'))
    environment: mainnet
    needs: [test, changes, deploy-devnet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the GCP secret read below
    concurrency:
      group: extension-registry-deploy-mainnet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Mainnet allowlist guard
        run: bash scripts/check-mainnet-allowlist.sh H7whziapWzGDH1b3QQzxno69TD4braekyBZhfjNGof4j
      - uses: dtolnay/rust-toolchain@stable

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Write deploy + program keypairs
        run: |
          mkdir -p ~/.config/solana target/deploy
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json
          echo '${{ secrets.EXTENSION_REGISTRY_PROGRAM_KEYPAIR }}' > target/deploy/extension_registry-keypair.json

      - name: Build program
        run: anchor build -p extension-registry

      - name: Read premium mainnet RPC
        run: |
          MAINNET_RPC="$(gcloud secrets versions access latest --secret=solana-rpc-url-mainnet)"
          if [ -z "$MAINNET_RPC" ]; then
            echo "::error::could not read solana-rpc-url-mainnet from Secret Manager" >&2
            exit 1
          fi
          echo "::add-mask::$MAINNET_RPC"
          echo "MAINNET_RPC=$MAINNET_RPC" >> "$GITHUB_ENV"

      - name: Close orphaned buffer accounts
        run: solana program close --buffers --url "$MAINNET_RPC" --keypair ~/.config/solana/id.json || true

      - name: Extend programdata if the new build is larger
        run: bash scripts/ensure-programdata-len.sh H7whziapWzGDH1b3QQzxno69TD4braekyBZhfjNGof4j target/deploy/extension_registry.so "$MAINNET_RPC"

      - name: Deploy extension-registry to mainnet
        run: |
          solana program deploy \
            --url "$MAINNET_RPC" \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id H7whziapWzGDH1b3QQzxno69TD4braekyBZhfjNGof4j \
            target/deploy/extension_registry.so

      - name: Close buffers left by a failed deploy
        if: failure()
        run: solana program close --buffers --url "$MAINNET_RPC" --keypair ~/.config/solana/id.json || true

      - name: Initialize GlobalState (idempotent)
        run: pnpm dlx tsx scripts/init-extension-registry.ts
        env:
          RPC_URL: ${{ env.MAINNET_RPC }}

      - name: Verify upgrade authority (mainnet)
        run: |
          bash scripts/check-upgrade-authority.sh \
            --cluster mainnet-beta \
            --program-id H7whziapWzGDH1b3QQzxno69TD4braekyBZhfjNGof4j
        env:
          EXPECTED_AUTHORITY_PUBKEY: CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY
