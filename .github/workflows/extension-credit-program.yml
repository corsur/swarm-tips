name: Extension Credit Program

on:
  push:
    branches: [main]
    paths:
      - 'programs/extension-credit/**'
      - 'tests/extension-credit.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'Anchor.toml'
      - '.github/workflows/extension-credit-program.yml'
  pull_request:
    paths:
      - 'programs/extension-credit/**'
      - 'tests/extension-credit.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'Anchor.toml'
      - '.github/workflows/extension-credit-program.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target cluster (mainnet requires explicitly selecting it)'
        required: true
        default: devnet
        type: choice
        options:
          - devnet
          - mainnet

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      program: ${{ steps.filter.outputs.program }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            program:
              - 'programs/extension-credit/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt -p extension-credit -- --check
      - run: cargo clippy -p extension-credit --all-targets -- -D warnings

      - name: Generate throwaway keypair for local validator
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json

      - name: Build program
        run: anchor build -p extension-credit

      - name: Start local validator
        run: |
          solana-test-validator \
            --bpf-program Ec628D7GH3hwgnVf1gqrUh83qcZprYjmTzvtdHHEr7oh target/deploy/extension_credit.so \
            --reset --quiet &
          sleep 8
          solana config set --url localhost --keypair /home/runner/.config/solana/id.json
          solana airdrop 100

      - name: Run extension-credit tests
        run: pnpm vitest run "tests/extension-credit.ts"
        env:
          ANCHOR_PROVIDER_URL: http://localhost:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json

      - name: Stop local validator
        if: always()
        run: pkill -f solana-test-validator || true

  deploy-devnet:
    # Staged pipeline: test -> devnet -> mainnet, automatic on push to main when
    # the program changed (mainnet allowlist: .github/mainnet-auto-deploy.yml).
    if: >-
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.changes.outputs.program == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'devnet'))
    needs: [test, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - name: Write deploy + program keypairs
        run: |
          mkdir -p ~/.config/solana target/deploy
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json
          echo '${{ secrets.EXTENSION_CREDIT_PROGRAM_KEYPAIR }}' > target/deploy/extension_credit-keypair.json

      - name: Build program
        run: anchor build -p extension-credit

      - name: Extend programdata if the new build is larger
        run: bash scripts/ensure-programdata-len.sh Ec628D7GH3hwgnVf1gqrUh83qcZprYjmTzvtdHHEr7oh target/deploy/extension_credit.so https://api.devnet.solana.com

      - name: Deploy to devnet
        # `--program-id <keypair>` (not a bare pubkey): the program moved to a new
        # address (the original devnet key was never CI-managed and is gone), so
        # the first deploy at the new id is a fresh account-create that the
        # program keypair must sign. Subsequent deploys upgrade in place.
        run: |
          solana program deploy \
            --url https://api.devnet.solana.com \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id target/deploy/extension_credit-keypair.json \
            target/deploy/extension_credit.so

  deploy-mainnet:
    # Manual dispatch only, target=mainnet. First-time mainnet deploy of
    # extension-credit (enables gasless onboarding on mainnet — the advance
    # instruction the onboard flow needs). Mirrors shillbot-program.yml's
    # mainnet job: reads the PREMIUM RPC from GCP Secret Manager via Workload
    # Identity and FAILS LOUD if the read/deploy fails — never falls back to
    # the flaky public api.mainnet-beta (the a685cdf silent-failure class).
    # Now automatic on push (after devnet succeeds), plus manual dispatch.
    if: >-
      always() &&
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.changes.outputs.program == 'true' &&
        needs.deploy-devnet.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'mainnet'))
    environment: mainnet
    needs: [test, changes, deploy-devnet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the GCP secret read below
    steps:
      - uses: actions/checkout@v4
      - name: Mainnet allowlist guard
        run: bash scripts/check-mainnet-allowlist.sh Ec628D7GH3hwgnVf1gqrUh83qcZprYjmTzvtdHHEr7oh
      - uses: dtolnay/rust-toolchain@stable

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - name: Write deploy + program keypairs
        run: |
          mkdir -p ~/.config/solana target/deploy
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json
          echo '${{ secrets.EXTENSION_CREDIT_PROGRAM_KEYPAIR }}' > target/deploy/extension_credit-keypair.json

      - name: Build program
        run: anchor build -p extension-credit

      - name: Close orphaned buffer accounts
        run: solana program close --buffers --url mainnet-beta --keypair ~/.config/solana/id.json || true

      - name: Read premium mainnet RPC
        run: |
          MAINNET_RPC="$(gcloud secrets versions access latest --secret=solana-rpc-url-mainnet)"
          if [ -z "$MAINNET_RPC" ]; then
            echo "::error::could not read solana-rpc-url-mainnet from Secret Manager" >&2
            exit 1
          fi
          echo "::add-mask::$MAINNET_RPC"
          echo "MAINNET_RPC=$MAINNET_RPC" >> "$GITHUB_ENV"

      - name: Extend programdata if the new build is larger
        run: bash scripts/ensure-programdata-len.sh Ec628D7GH3hwgnVf1gqrUh83qcZprYjmTzvtdHHEr7oh target/deploy/extension_credit.so "$MAINNET_RPC"

      - name: Deploy extension-credit to mainnet
        run: |
          solana program deploy \
            --url "$MAINNET_RPC" \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id target/deploy/extension_credit-keypair.json \
            target/deploy/extension_credit.so

      - name: Close buffers left by a failed deploy
        if: failure()
        run: solana program close --buffers --url "$MAINNET_RPC" --keypair ~/.config/solana/id.json || true

      - name: Verify upgrade authority (mainnet)
        run: |
          bash scripts/check-upgrade-authority.sh \
            --cluster mainnet-beta \
            --program-id Ec628D7GH3hwgnVf1gqrUh83qcZprYjmTzvtdHHEr7oh
        env:
          EXPECTED_AUTHORITY_PUBKEY: CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY
