name: Sponsored Claim E2E (devnet)

# C3 gasless-sponsorship proof against the LIVE devnet shillbot program: a
# sponsored claim_task where the sponsor is fee-payer (pays gas) and the agent
# co-signs the authority. Asserts the sponsor (not the agent) paid the fee.
#
# MANUAL ONLY (workflow_dispatch): each run locks ~0.0053 SOL on devnet (task
# escrow + Task PDA rent + the fresh agent's AgentState rent) that only the
# shillbot authority can reclaim (emergency_return) or that expire_task frees
# after the deadline — so it must NOT run on every push. The script sweeps the
# recoverable leftovers back to the deploy wallet and prints a money ledger.
#
# Requires secrets.SOLANA_DEPLOY_KEYPAIR funded with devnet SOL (it acts as the
# task client + funder for the throwaway sponsor/agent).

on:
  workflow_dispatch:

jobs:
  sponsored-claim-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Install client keypair (task client + funder)
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json

      - name: Build shillbot (generates the IDL the e2e loads)
        run: anchor build -p shillbot

      - name: Run the sponsored-claim devnet e2e
        run: npx tsx scripts/e2e/sponsored-claim-devnet.ts
