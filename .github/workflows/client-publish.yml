name: Unified JavaScript Client

on:
  push:
    branches: [main]
    paths:
      - 'sdk/client/**'
      - 'target/idl/**'
      - 'target/types/**'
      - '.github/workflows/client-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@^11.15.0
      - run: pnpm install --frozen-lockfile
      - name: Verify generated bindings, tests, types, and browser boundaries
        run: |
          pnpm --filter @swarm-tips/client check:generated
          pnpm --filter @swarm-tips/client test
          pnpm --filter @swarm-tips/client lint
          if grep -R --line-number --include='*.ts' "from [\"']node:" sdk/client/src --exclude-dir=cli --exclude='*.test.ts'; then
            echo 'Browser library source imports a Node built-in'
            exit 1
          fi
      - name: Pack and verify the exact artifact
        run: |
          mkdir -p "$RUNNER_TEMP/swarm-client"
          pnpm --filter @swarm-tips/client pack --pack-destination "$RUNNER_TEMP/swarm-client"
          package_version="$(node --input-type=module -e "import pkg from './sdk/client/package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          package_tarball="$RUNNER_TEMP/swarm-client/swarm-tips-client-${package_version}.tgz"
          pnpm --filter @swarm-tips/client verify:packed "$package_tarball"
      - name: Publish immutable client with provenance
        run: |
          package_version="$(node --input-type=module -e "import pkg from './sdk/client/package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          package_tarball="$RUNNER_TEMP/swarm-client/swarm-tips-client-${package_version}.tgz"
          if npm view "@swarm-tips/client@${package_version}" version >/dev/null 2>&1; then
            attestation_url="$(npm view "@swarm-tips/client@${package_version}" dist.attestations.url)"
            published_git_head="$(node --input-type=module -e "const document = await fetch(process.argv[1]).then((response) => response.json()); for (const attestation of document.attestations ?? []) { const statement = JSON.parse(Buffer.from(attestation.bundle?.dsseEnvelope?.payload ?? '', 'base64').toString('utf8')); const dependencies = statement.predicate?.buildDefinition?.resolvedDependencies ?? []; const commit = dependencies.find((dependency) => dependency.digest?.gitCommit)?.digest?.gitCommit; if (commit) { process.stdout.write(commit); break; } }" "$attestation_url")"
            if [ -z "$published_git_head" ]; then
              echo "Could not resolve the published source commit from npm provenance"
              exit 1
            fi
            if ! git diff --quiet "$published_git_head" -- sdk/client ":(exclude)sdk/client/src/**/*.test.ts"; then
              echo "@swarm-tips/client@${package_version} already exists from ${published_git_head}, but sdk/client has changed; bump the package version"
              exit 1
            fi
            echo "@swarm-tips/client@${package_version} already published from unchanged source at ${published_git_head}"
          else
            npm publish "$package_tarball" --access public --provenance
          fi
