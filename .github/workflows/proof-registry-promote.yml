name: Promote Verified Lean Proofs

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      network:
        description: "Target Solana network (devnet runs in isolated dry-run mode only; never opens a PR)"
        required: false
        default: "mainnet"
        type: choice
        options:
          - mainnet
          - devnet
      dry_run:
        description: "Stage and audit in isolated /tmp/dry-run-registry without opening a PR"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "proofs/SwarmProofs/registry.json"
      - "proofs/SwarmProofs/SwarmProofs/Generated/**"

concurrency:
  group: proof-registry-promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch-and-stage:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      has_candidates: ${{ steps.fetch.outputs.has_candidates }}
      effective_network: ${{ steps.fetch.outputs.effective_network }}
      effective_dry_run: ${{ steps.fetch.outputs.effective_dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v3

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: proof-registry

      - name: Fetch and stage finalized policy-4 promotion candidates (Rust only, no Lean)
        id: fetch
        env:
          INPUT_NETWORK: ${{ inputs.network }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          NETWORK="${INPUT_NETWORK:-mainnet}"
          if [ "$NETWORK" != "mainnet" ] || [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            DRY_RUN="true"
          else
            DRY_RUN="false"
          fi
          echo "effective_network=${NETWORK}" >> "$GITHUB_OUTPUT"
          echo "effective_dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

          rm -rf /tmp/staged-promotion /tmp/dry-run-registry
          mkdir -p /tmp/staged-promotion/candidates

          EXTRA_ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS+=(--dry-run-registry /tmp/dry-run-registry)
          fi

          cargo run --locked -p xtask -- fetch-promotion-candidates \
            --out-dir /tmp/staged-promotion/candidates \
            --network "$NETWORK" \
            --bucket coordination-game-prod-swarm-tips \
            --project coordination-game-prod \
            --registry proofs/SwarmProofs/registry.json \
            --rejected-file proofs/SwarmProofs/rejected-candidates.json \
            --catalog-dir tests/fixtures/lean/catalog \
            "${EXTRA_ARGS[@]}"

          if [ ! -s /tmp/staged-promotion/candidates/autopromote-plan.tsv ]; then
            echo "has_candidates=false" >> "$GITHUB_OUTPUT"
            echo "No eligible policy-4 candidates to promote on network=${NETWORK}."
            exit 0
          fi

          echo "has_candidates=true" >> "$GITHUB_OUTPUT"

      - name: Upload trusted staged candidate plan
        if: steps.fetch.outputs.has_candidates == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staged-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/staged-promotion/candidates/
          if-no-files-found: error
          retention-days: 5

  audit-untrusted-lean:
    needs: fetch-and-stage
    if: needs.fetch-and-stage.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download trusted staged candidate plan
        uses: actions/download-artifact@v7
        with:
          name: staged-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/staged-promotion/candidates

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: proof-registry
          save-if: false

      - name: Validate clean baseline registry and frozen library hashes
        run: cargo run --locked -p proof-registry --bin proof-registry -- validate proofs/SwarmProofs/registry.json

      - name: Install pinned Lean environment (read-only cache, save disabled)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/SwarmProofs
          use-github-cache: false
          build: false
          test: false

      - name: Build pinned trusted environment only
        working-directory: proofs/SwarmProofs
        run: lake build Zeta23

      - name: Build pinned lean4export and nanoda_bin once before candidate loop
        run: |
          set -euo pipefail
          LEAN4EXPORT_REV="9fb131bb100eb32ccf6836f14e4f8328d13b6792"
          NANODA_REV="3a2407216ee84a75f9e1aead6803d0578be06ae7"
          rm -rf /tmp/swarm-audit-tools
          mkdir -p /tmp/swarm-audit-tools

          git clone --quiet https://github.com/leanprover/lean4export.git /tmp/swarm-audit-tools/lean4export
          git -C /tmp/swarm-audit-tools/lean4export checkout --quiet "$LEAN4EXPORT_REV"
          cp proofs/SwarmProofs/lean-toolchain /tmp/swarm-audit-tools/lean4export/lean-toolchain
          (cd /tmp/swarm-audit-tools/lean4export && lake build)

          git clone --quiet https://github.com/ammkrn/nanoda_lib.git /tmp/swarm-audit-tools/nanoda
          git -C /tmp/swarm-audit-tools/nanoda checkout --quiet "$NANODA_REV"
          (cd /tmp/swarm-audit-tools/nanoda && cargo build --release --locked)

          test -x /tmp/swarm-audit-tools/lean4export/.lake/build/bin/lean4export
          test -x /tmp/swarm-audit-tools/nanoda/target/release/nanoda_bin
          echo "LEAN4EXPORT_BIN=/tmp/swarm-audit-tools/lean4export/.lake/build/bin/lean4export" >> "$GITHUB_ENV"
          echo "NANODA_BIN=/tmp/swarm-audit-tools/nanoda/target/release/nanoda_bin" >> "$GITHUB_ENV"

      - name: Audit staged candidates one-by-one with isolated rollback
        env:
          AUDIT_NETWORK: ${{ needs.fetch-and-stage.outputs.effective_network }}
          AUDIT_DRY_RUN: ${{ needs.fetch-and-stage.outputs.effective_dry_run }}
        run: |
          set -euo pipefail
          rm -rf /tmp/audit-verdicts /tmp/dry-run-audit
          mkdir -p /tmp/audit-verdicts
          PKG_DIR="proofs/SwarmProofs"
          if [ "${AUDIT_DRY_RUN}" = "true" ]; then
            mkdir -p /tmp/dry-run-audit/SwarmProofs
            cp -R proofs/SwarmProofs/. /tmp/dry-run-audit/SwarmProofs/
            PKG_DIR="/tmp/dry-run-audit/SwarmProofs"
          fi
          cargo run --locked -p xtask -- audit-staged-candidates \
            --staged-dir /tmp/staged-promotion/candidates \
            --package "$PKG_DIR" \
            --network "${AUDIT_NETWORK:-mainnet}" \
            --verdicts-out /tmp/audit-verdicts/audit-verdicts.json

      - name: Restore non-umbrella public package root
        if: always()
        run: |
          if [ -f proofs/SwarmProofs/lakefile.toml.original ]; then
            mv proofs/SwarmProofs/lakefile.toml.original proofs/SwarmProofs/lakefile.toml
          fi
          rm -f proofs/SwarmProofs/PromotionAudit.lean

      - name: Upload audit verdicts JSON only (zero Lean/registry files trusted downstream)
        uses: actions/upload-artifact@v7
        with:
          name: audit-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/audit-verdicts/audit-verdicts.json
          if-no-files-found: error
          retention-days: 5

  open-pr:
    needs: [fetch-and-stage, audit-untrusted-lean]
    if: >-
      needs.fetch-and-stage.outputs.has_candidates == 'true' &&
      needs.fetch-and-stage.outputs.effective_network == 'mainnet' &&
      needs.fetch-and-stage.outputs.effective_dry_run == 'false' &&
      (inputs.network == '' || inputs.network == 'mainnet') &&
      inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enforce mainnet non-dry-run & require PROMOTE_BOT_TOKEN secret
        env:
          EFFECTIVE_NETWORK: ${{ needs.fetch-and-stage.outputs.effective_network }}
          EFFECTIVE_DRY_RUN: ${{ needs.fetch-and-stage.outputs.effective_dry_run }}
          PROMOTE_BOT_TOKEN: ${{ secrets.PROMOTE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${EFFECTIVE_NETWORK}" != "mainnet" ] || [ "${EFFECTIVE_DRY_RUN}" = "true" ]; then
            echo "::error::Refusing to open promotion PR for network=${EFFECTIVE_NETWORK} dry_run=${EFFECTIVE_DRY_RUN}; devnet/dry-run proofs never enter the public registry."
            exit 1
          fi
          if [ -z "${PROMOTE_BOT_TOKEN:-}" ]; then
            echo "::error::PROMOTE_BOT_TOKEN secret must be configured so promotion PRs trigger required status checks and auto-merge."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_BOT_TOKEN }}

      - name: Download trusted staged candidates from fetch-and-stage
        uses: actions/download-artifact@v7
        with:
          name: staged-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/staged-promotion/candidates

      - name: Download audit-verdicts.json from audit-untrusted-lean
        uses: actions/download-artifact@v7
        with:
          name: audit-verdicts-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/audit-verdicts

      - name: Validate audit-verdicts.json schema strictly via jq regex before Rust reconstruction
        run: |
          set -euo pipefail
          jq -e '
            .schema == "swarm.lean-audit-verdicts/v1" and
            .network == "mainnet" and
            (.passed_task_ids | type == "array" and all(type == "string" and test("^[A-Za-z0-9:._-]{1,128}$"))) and
            (.rejected | type == "array" and all(
              type == "object" and
              (.task_id | type == "string" and test("^[A-Za-z0-9:._-]{1,128}$")) and
              (.artifact_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
              (.reason | type == "string" and (
                . == "autopromote_policy_failed" or
                . == "registry_validation_failed" or
                . == "source_policy_failed" or
                . == "lean_compile_failed" or
                . == "nanoda_or_expr_stability_failed" or
                . == "axiom_audit_failed"
              ))
            ))
          ' /tmp/audit-verdicts/audit-verdicts.json > /dev/null

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: proof-registry

      - name: Reconstruct verified modules from trusted staged candidates (Rust only, no Lean)
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- apply-verified-promotions \
            --staged-dir /tmp/staged-promotion/candidates \
            --verdicts /tmp/audit-verdicts/audit-verdicts.json \
            --registry proofs/SwarmProofs/registry.json \
            --package proofs/SwarmProofs \
            --rejected-file proofs/SwarmProofs/rejected-candidates.json
          cargo run --locked -p proof-registry --bin proof-registry -- validate proofs/SwarmProofs/registry.json

      - name: Open or update single canonical promotion PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- proofs/SwarmProofs/registry.json proofs/SwarmProofs/rejected-candidates.json && \
             [ -z "$(git status --porcelain -- proofs/SwarmProofs/SwarmProofs/Generated)" ]; then
            echo "No net changes against main."
            exit 0
          fi

          REG_HASH="$(sha256sum proofs/SwarmProofs/registry.json | cut -c1-12)"
          BRANCH="promote/swarm-proofs-auto"
          PASSED_COUNT="$(jq '.passed_task_ids | length' /tmp/audit-verdicts/audit-verdicts.json)"
          REJECTED_COUNT="$(jq '.rejected | length' /tmp/audit-verdicts/audit-verdicts.json)"

          git config user.name "swarm-proof-promoter[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add proofs/SwarmProofs/registry.json proofs/SwarmProofs/rejected-candidates.json
          if [ -d proofs/SwarmProofs/SwarmProofs/Generated ]; then
            git add proofs/SwarmProofs/SwarmProofs/Generated
          fi
          git commit -m "chore(proofs): autopromote ${PASSED_COUNT} verified policy-4 module(s), record ${REJECTED_COUNT} rejection(s) (${REG_HASH})"
          git push --force-with-lease origin "$BRANCH"

          # Close any stale legacy promote/swarm-proofs-* PRs other than canonical promote/swarm-proofs-auto
          STALE_PRS="$(gh pr list --base main --state open --json number,headRefName --jq '.[] | select((.headRefName | startswith("promote/swarm-proofs-")) and (.headRefName != "promote/swarm-proofs-auto")) | .number')"
          for pr_num in $STALE_PRS; do
            gh pr close "$pr_num" --delete-branch --comment "Superseded by canonical single-PR branch \`promote/swarm-proofs-auto\`." || true
          done

          TITLE="chore(proofs): autopromote ${PASSED_COUNT} verified policy-4 module(s) (${REG_HASH})"
          BODY="Automated promotion of finalized \`platform=10\`, \`lean_policy=4\`, \`score=1_000_000\` proof module(s) reconstructed purely in Rust from trusted \`fetch-and-stage\` candidates after isolated per-candidate \`lake build\`, \`check-statement-expr-stability\`, \`nanoda\`, and axiom audit (${PASSED_COUNT} promoted, ${REJECTED_COUNT} audit rejection(s) recorded)."

          EXISTING_PR="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "$EXISTING_PR" ]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY")"
          else
            PR_URL="$EXISTING_PR"
            gh pr edit "$PR_URL" --title "$TITLE" --body "$BODY"
          fi
          echo "Promotion PR: $PR_URL"
          gh pr merge "$PR_URL" --auto --squash

  notify-runner:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.SWARM_PROOFS_RUNNER_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch swarm-proofs-promoted to coordination-app on main merge
        env:
          DISPATCH_TOKEN: ${{ secrets.COORDINATION_APP_DISPATCH_TOKEN }}
          SWARM_PROOFS_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::error::COORDINATION_APP_DISPATCH_TOKEN is required when SWARM_PROOFS_RUNNER_DISPATCH_ENABLED=true."
            exit 1
          fi
          PAYLOAD="$(jq -nc --arg rev "$SWARM_PROOFS_REV" '{event_type: "swarm-proofs-promoted", client_payload: {swarm_proofs_rev: $rev}}')"
          printf 'header = "Authorization: Bearer %s"\n' "$DISPATCH_TOKEN" | curl -fsSL --max-time 30 --config - \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/corsur/coordination-app/dispatches" \
            -d "$PAYLOAD"
          echo "Dispatched swarm-proofs-promoted (${SWARM_PROOFS_REV}) to corsur/coordination-app."
