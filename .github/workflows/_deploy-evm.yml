name: _deploy-evm

# Reusable EVM contract deployer — the EVM analog of _deploy-service.yml.
# Parameterized by BOTH `contract` (which Foundry contract) and `network` (which
# chain), so ONE mechanism deploys any contract to any chain — testnet today,
# Base/Ethereum mainnet at the gated launch. Manual-only at the caller: deploying
# a fresh contract orphans prior state, so it's always an explicit decision. The
# deployed address is recorded into crates/chain-registry (the single source of
# truth) in a follow-up commit, then verified against the on-chain
# stakeWei/maxTrancheWei by the evm-ci parity guard.
#
# Per-network config (stake, tranche) lives in the "Resolve network config" step
# and MUST match the crates/chain-registry entry for that CAIP-2 chain in
# lockstep — the parity guard fails CI on divergence once a chain is live. The
# chainTag is DERIVED from the CAIP-2 string via `cast keccak` (no hardcoded
# duplicate). The deployer key is selected by network: testnet → EVM_TESTNET_DEPLOYER
# (a CI-only throwaway), mainnet → EVM_MAINNET_DEPLOYER.
#
# To add a chain: add a `network` case below + a crates/chain-registry entry +
# (for mainnet) a foundry.toml rpc_endpoints alias. To add a contract: add a
# `script/Deploy<Name>.s.sol`, a `contract` value, and a per-contract deploy step.

on:
  workflow_call:
    inputs:
      contract:
        description: 'Which contract to deploy: crosschain | coordination | shillbot'
        required: true
        type: string
      network:
        description: 'Target network: base_sepolia | base | ethereum'
        required: false
        default: base_sepolia
        type: string
    secrets:
      EVM_TESTNET_DEPLOYER:
        required: false
      EVM_MAINNET_DEPLOYER:
        required: false
      # Optional keyed mainnet RPC (Alchemy/Infura URL). Public mainnet RPCs
      # rate-limit forge broadcasts; supply this for a reliable mainnet deploy.
      # Empty → the deploy falls back to the foundry.toml alias for `network`.
      EVM_MAINNET_RPC_URL:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    env:
      # Owner / operator / treasury are the SAME across networks (founder decision:
      # reuse the xchain authority key, then transfer on-chain owner + operatorSigner
      # to a fresh key post-mainnet-deploy — Ownable2Step). operatorSigner ==
      # game-api's xchain-operator-signer (GCP Secret Manager), so game-api's
      # normalized v=27/28 attestations verify on-chain.
      XCHAIN_OWNER: '0x996213ed4099707059b8b5d7489ffF23dAC9770d'
      XCHAIN_OPERATOR_SIGNER: '0x54a600649C2906f7Bb0D52E74818Ce025afd9A30'
      XCHAIN_TREASURY: '0x996213ed4099707059b8b5d7489ffF23dAC9770d'
      XCHAIN_TREASURY_BPS: '5000'
      # Both deployer secrets in env (masked); the deploy step picks by network.
      EVM_TESTNET_DEPLOYER: ${{ secrets.EVM_TESTNET_DEPLOYER }}
      EVM_MAINNET_DEPLOYER: ${{ secrets.EVM_MAINNET_DEPLOYER }}
      EVM_MAINNET_RPC_URL: ${{ secrets.EVM_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve network config
        # Stake/tranche MUST equal the crates/chain-registry entry for this CAIP-2
        # (the parity guard enforces it once live). IS_MAINNET selects the deployer
        # key and gates the mainnet-secret presence check below.
        run: |
          set -euo pipefail
          case "${{ inputs.network }}" in
            base_sepolia)
              echo "CAIP2=eip155:84532" >> "$GITHUB_ENV"
              echo "IS_MAINNET=false" >> "$GITHUB_ENV"
              echo "XCHAIN_STAKE_WEI=3200000000000000" >> "$GITHUB_ENV"                # 0.0032 ETH
              echo "XCHAIN_MAX_TRANCHE_WEI=6400000000000000" >> "$GITHUB_ENV"          # 0.0064 ETH
              echo "XCHAIN_DAILY_TRANCHE_CAP_WEI=64000000000000000" >> "$GITHUB_ENV"   # 0.064 ETH (~10 matches/day)
              ;;
            base)
              echo "CAIP2=eip155:8453" >> "$GITHUB_ENV"
              echo "IS_MAINNET=true" >> "$GITHUB_ENV"
              echo "XCHAIN_STAKE_WEI=500000000000000" >> "$GITHUB_ENV"                 # 0.0005 ETH (low launch stake)
              echo "XCHAIN_MAX_TRANCHE_WEI=1000000000000000" >> "$GITHUB_ENV"          # 0.001 ETH (2× stake)
              echo "XCHAIN_DAILY_TRANCHE_CAP_WEI=10000000000000000" >> "$GITHUB_ENV"   # 0.01 ETH (~10 matches/day)
              ;;
            ethereum)
              echo "CAIP2=eip155:1" >> "$GITHUB_ENV"
              echo "IS_MAINNET=true" >> "$GITHUB_ENV"
              echo "XCHAIN_STAKE_WEI=10000000000000000" >> "$GITHUB_ENV"               # 0.01 ETH
              echo "XCHAIN_MAX_TRANCHE_WEI=20000000000000000" >> "$GITHUB_ENV"          # 0.02 ETH
              echo "XCHAIN_DAILY_TRANCHE_CAP_WEI=200000000000000000" >> "$GITHUB_ENV"   # 0.2 ETH (~10 matches/day)
              ;;
            *)
              echo "::error::unknown network '${{ inputs.network }}' (expected base_sepolia | base | ethereum)"
              exit 1
              ;;
          esac

      - name: Select deployer key and RPC target
        # Pick the network's deployer secret and fail loudly if the required one
        # is unset — a mainnet deploy must never silently fall back to the testnet key.
        run: |
          set -euo pipefail
          if [ "$IS_MAINNET" = "true" ]; then
            if [ -z "$EVM_MAINNET_DEPLOYER" ]; then
              echo "::error::EVM_MAINNET_DEPLOYER secret is required for a mainnet deploy"
              exit 1
            fi
            echo "DEPLOYER_PK=$EVM_MAINNET_DEPLOYER" >> "$GITHUB_ENV"
            echo "RPC_TARGET=${EVM_MAINNET_RPC_URL:-${{ inputs.network }}}" >> "$GITHUB_ENV"
          else
            if [ -z "$EVM_TESTNET_DEPLOYER" ]; then
              echo "::error::EVM_TESTNET_DEPLOYER secret is required for a testnet deploy"
              exit 1
            fi
            echo "DEPLOYER_PK=$EVM_TESTNET_DEPLOYER" >> "$GITHUB_ENV"
            echo "RPC_TARGET=${{ inputs.network }}" >> "$GITHUB_ENV"
          fi

      - name: Derive chain tag
        # chainTag = keccak256(CAIP-2 string bytes) — byte-identical to the registry's
        # chain_tag and what both on-chain programs check leg membership against.
        run: echo "XCHAIN_CHAIN_TAG=$(cast keccak "$CAIP2")" >> "$GITHUB_ENV"

      - name: Deploy CrossChainGame
        if: inputs.contract == 'crosschain'
        env:
          XCHAIN_CLAIM_WINDOW: '3600'
          XCHAIN_SKEW_MARGIN: '900'
        run: |
          forge script script/Deploy.s.sol \
            --rpc-url "$RPC_TARGET" \
            --private-key "$DEPLOYER_PK" \
            --broadcast

      - name: Deploy CoordinationGame
        if: inputs.contract == 'coordination'
        env:
          COORD_COMMIT_TIMEOUT: '3600' # Active + Committing
          COORD_REVEAL_TIMEOUT: '7200' # Revealing
        run: |
          forge script script/DeployCoordinationGame.s.sol \
            --rpc-url "$RPC_TARGET" \
            --private-key "$DEPLOYER_PK" \
            --broadcast

      - name: Deploy ShillbotEscrow
        if: inputs.contract == 'shillbot'
        env:
          SHILLBOT_ESCROW_CHAIN_TAG: ${{ env.XCHAIN_CHAIN_TAG }}
          SHILLBOT_ESCROW_OWNER: ${{ env.XCHAIN_OWNER }}
          # Bootstrap attester = the shared xchain operator key (satisfies the
          # signer != owner != treasury gate). Rotate to the dedicated
          # shillbot-attester EVM key via setConfig before real use.
          SHILLBOT_ESCROW_ATTESTER_SIGNER: ${{ env.XCHAIN_OPERATOR_SIGNER }}
          SHILLBOT_ESCROW_TREASURY: ${{ env.XCHAIN_TREASURY }}
          SHILLBOT_ESCROW_FEE_BPS: '1000' # 10%
          SHILLBOT_ESCROW_QUALITY_THRESHOLD: '200000' # kind-0 payout floor (of 1_000_000)
          SHILLBOT_ESCROW_CHALLENGE_WINDOW_SECS: '3600'
          SHILLBOT_ESCROW_DISPUTE_WINDOW_SECS: '86400'
          SHILLBOT_ESCROW_VERIFICATION_TIMEOUT_SECS: '86400'
          SHILLBOT_ESCROW_BOND_MULTIPLIER: '2'
          SHILLBOT_ESCROW_BOND_SLASH_TREASURY_BPS: '5000'
          SHILLBOT_ESCROW_MIN_ESCROW_WEI: '100000000000000' # 0.0001 ETH
          SHILLBOT_ESCROW_MAX_ESCROW_WEI: '1000000000000000000' # 1 ETH (testnet cap)
        run: |
          forge script script/DeployShillbotEscrow.s.sol \
            --rpc-url "$RPC_TARGET" \
            --private-key "$DEPLOYER_PK" \
            --broadcast
