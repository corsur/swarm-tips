name: _deploy-evm

# Reusable EVM contract deployer — the EVM analog of _deploy-service.yml.
# Parameterized by `contract`, so the repo deploys ANY Foundry contract through
# ONE mechanism (vs. a per-contract copy-paste). Manual-only at the caller:
# deploying a fresh contract orphans prior state, so it's always an explicit
# decision. The deployed address is recorded into crates/chain-registry (the
# single source of truth) in a follow-up commit.
#
# To add a contract: add a `script/Deploy<Name>.s.sol`, a `contract` value, and
# a per-contract deploy step below with its contract-specific env.

on:
  workflow_call:
    inputs:
      contract:
        description: 'Which contract to deploy: crosschain | coordination | shillbot'
        required: true
        type: string
      network:
        description: 'Target network (must exist in foundry.toml rpc_endpoints)'
        required: false
        default: base_sepolia
        type: string
    secrets:
      EVM_TESTNET_DEPLOYER:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    env:
      # Shared testnet config (identical for every contract). CI-only deploy key
      # (per CLAUDE.md: CI values → GitHub Secrets). TESTNET-ONLY — rotate before
      # any mainnet deploy. Stake is the SETTLED $5 anchor (0.0032 ETH); the
      # audit-fixed contracts enforce MIN_STAKE_WEI = 1e14 (L1 bounds), so the old
      # 0.00001-ETH smoke stake would now REVERT at deploy. Must equal the
      # crates/chain-registry eip155:84532 stake_base_units (a mismatch fails the
      # live settle digest). Production parity re-tunes at the gated mainnet deploy.
      DEPLOYER_PK: ${{ secrets.EVM_TESTNET_DEPLOYER }}
      XCHAIN_OWNER: '0x996213ed4099707059b8b5d7489ffF23dAC9770d'
      # Dedicated secp256k1 operator/attestor (public address; the private key
      # lives in GCP Secret Manager as xchain-operator-signer for game-api).
      XCHAIN_OPERATOR_SIGNER: '0x54a600649C2906f7Bb0D52E74818Ce025afd9A30'
      XCHAIN_TREASURY: '0x996213ed4099707059b8b5d7489ffF23dAC9770d'
      XCHAIN_TREASURY_BPS: '5000'
      XCHAIN_STAKE_WEI: '3200000000000000' # 0.0032 ETH ($5 anchor; == registry stake_base_units)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Deploy CrossChainGame
        if: inputs.contract == 'crosschain'
        env:
          # chainTag mirrors crates/chain-registry (Base Sepolia row).
          XCHAIN_CHAIN_TAG: '0x8a9a9c58b754a98f1ff302a7ead652cfd23eb36a5791767b5d185067dd9481c2'
          XCHAIN_MAX_TRANCHE_WEI: '6400000000000000' # 0.0064 ETH (2× stake; == registry max_tranche_base_units)
          XCHAIN_CLAIM_WINDOW: '3600'
          XCHAIN_SKEW_MARGIN: '900'
        run: |
          forge script script/Deploy.s.sol \
            --rpc-url ${{ inputs.network }} \
            --private-key "$DEPLOYER_PK" \
            --broadcast

      - name: Deploy CoordinationGame
        if: inputs.contract == 'coordination'
        env:
          COORD_COMMIT_TIMEOUT: '3600' # Active + Committing
          COORD_REVEAL_TIMEOUT: '7200' # Revealing
        run: |
          forge script script/DeployCoordinationGame.s.sol \
            --rpc-url ${{ inputs.network }} \
            --private-key "$DEPLOYER_PK" \
            --broadcast

      - name: Deploy ShillbotEscrow
        if: inputs.contract == 'shillbot'
        env:
          # chainTag mirrors crates/chain-registry (Base Sepolia row).
          SHILLBOT_ESCROW_CHAIN_TAG: '0x8a9a9c58b754a98f1ff302a7ead652cfd23eb36a5791767b5d185067dd9481c2'
          SHILLBOT_ESCROW_OWNER: ${{ env.XCHAIN_OWNER }}
          # Bootstrap attester = the shared xchain operator key (satisfies the
          # signer != owner != treasury gate). Rotate to the dedicated
          # shillbot-attester EVM key via setConfig before real use.
          SHILLBOT_ESCROW_ATTESTER_SIGNER: ${{ env.XCHAIN_OPERATOR_SIGNER }}
          SHILLBOT_ESCROW_TREASURY: ${{ env.XCHAIN_TREASURY }}
          SHILLBOT_ESCROW_FEE_BPS: '1000' # 10%
          SHILLBOT_ESCROW_QUALITY_THRESHOLD: '200000' # kind-0 payout floor (of 1_000_000)
          SHILLBOT_ESCROW_CHALLENGE_WINDOW_SECS: '3600'
          SHILLBOT_ESCROW_DISPUTE_WINDOW_SECS: '86400'
          SHILLBOT_ESCROW_VERIFICATION_TIMEOUT_SECS: '86400'
          SHILLBOT_ESCROW_BOND_MULTIPLIER: '2'
          SHILLBOT_ESCROW_BOND_SLASH_TREASURY_BPS: '5000'
          SHILLBOT_ESCROW_MIN_ESCROW_WEI: '100000000000000' # 0.0001 ETH
          SHILLBOT_ESCROW_MAX_ESCROW_WEI: '1000000000000000000' # 1 ETH (testnet cap)
        run: |
          forge script script/DeployShillbotEscrow.s.sol \
            --rpc-url ${{ inputs.network }} \
            --private-key "$DEPLOYER_PK" \
            --broadcast
