name: Deploy EVM Testnet

# Manual-only entry point for deploying an EVM contract to a testnet. Picks the
# contract, then delegates to the reusable _deploy-evm.yml (the EVM analog of
# _deploy-service.yml). Deploying a fresh contract orphans prior state, so this
# is always an explicit decision; record the deployed address into
# crates/chain-registry (the single source of truth) in a follow-up commit.
on:
  workflow_dispatch:
    inputs:
      contract:
        description: 'Which contract to deploy'
        required: true
        type: choice
        options:
          - coordination
          - coordinationv4
          - coordinationv4-upgrade
          - crosschain
          - shillbot
        default: coordination
      network:
        description: 'Target network (must exist in foundry.toml rpc_endpoints)'
        required: true
        default: base_sepolia

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-evm.yml
    with:
      contract: ${{ github.event.inputs.contract }}
      network: ${{ github.event.inputs.network }}
    secrets:
      EVM_TESTNET_DEPLOYER: ${{ secrets.EVM_TESTNET_DEPLOYER }}
      # Mainnet secrets intentionally NOT passed — this entry point is testnet-only.
