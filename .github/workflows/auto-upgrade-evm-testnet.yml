name: Auto-upgrade EVM Testnet

# Ship a CoordinationGameV4 logic change automatically: Base Sepolia first,
# then the allowlisted MAINNET proxies (Base, then Ethereum), so no deployed
# proxy is ever behind main. The workflow name and file are kept for history.
#
# WHY THIS IS SAFE HERE AND NOT FOR A FRESH DEPLOY. `_deploy-evm.yml` fresh
# deploys stay manual because a NEW contract mints a new address, orphans the
# prior state, and forces every consumer to be re-pointed. An UPGRADE is the
# opposite: `upgradeToAndCall(impl, "")` keeps the SAME ERC1967 proxy address,
# touches no storage (layout pinned by CoordinationGameV4Layout.t.sol), and
# re-points nothing.
#
# MAINNET (upgrade-mainnet): runs only after the Base Sepolia upgrade
# succeeded, only for proxies listed in .github/mainnet-auto-deploy.yml, with a
# keyed RPC from GCP Secret Manager. Each network: chain-id check, owner ==
# deployer check, simulated upgrade on the live state, broadcast, then verify
# the ERC1967 implementation slot moved and owner/currentSeasonId are unchanged.
#
# GATED ON TESTS. It triggers on the EVM Contracts run COMPLETING SUCCESSFULLY,
# not on the push, so a red forge suite can never reach the chain.

on:
  workflow_run:
    workflows: ['EVM Contracts']
    types: [completed]
    branches: [main]
  # Manual escape hatch: re-run the upgrade without pushing a contract change
  # (e.g. after rotating the proxy variable, or to recover a failed broadcast).
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list in deploy-base-sha.sh
    # `workflow_run` fires on failure and cancellation too. Without this, a red
    # forge suite would still broadcast an upgrade.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      xchain_changed: ${{ steps.diff.outputs.xchain_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the commit the EVM Contracts run actually tested. A
          # `workflow_run` job defaults to the branch head, which is a DIFFERENT
          # commit whenever anything landed in between — the diff below would
          # then describe the wrong pair, and this workflow exists to stop a
          # human reading one version while the chain runs another.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the diff base is the last successful run's head.
          fetch-depth: 0

      - name: Did the upgradeable contract's own sources change?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "xchain_changed=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — upgrading regardless of the diff"
            exit 0
          fi
          # EVM Contracts also runs for chain-registry, policy and fixture
          # changes, none of which alter deployed bytecode. Broadcasting an
          # upgrade for those spends gas to install identical logic and adds a
          # pointless proxy event, so scope to what actually compiles into V4 / XChain.
          # Diff against the last fully successful run (not HEAD^) so a change
          # whose upgrade failed is retried by the next green commit.
          BASE="$(bash scripts/deploy-base-sha.sh auto-upgrade-evm-testnet.yml HEAD^ workflow_run)"
          if git diff --name-only "$BASE" HEAD \
             | grep -Eq '^evm/(src/CoordinationGameV4\.sol|src/base/|src/CertLib\.sol|src/SeasonPot\.sol|script/UpgradeCoordinationGameV4\.s\.sol)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no CoordinationGameV4 source change — skipping upgrade"
          fi
          if git diff --name-only "$BASE" HEAD \
             | grep -Eq '^evm/(src/CrossChainGame\.sol|src/base/|src/CertLib\.sol|script/UpgradeCrossChainGame\.s\.sol)'; then
            echo "xchain_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "xchain_changed=false" >> "$GITHUB_OUTPUT"
            echo "no CrossChainGame source change — skipping upgrade"
          fi

  upgrade:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    uses: ./.github/workflows/_deploy-evm.yml
    with:
      contract: coordinationv4-upgrade
      network: base_sepolia
    secrets:
      EVM_TESTNET_DEPLOYER: ${{ secrets.EVM_TESTNET_DEPLOYER }}
      # Mainnet secrets are NOT passed to the testnet leg.

  upgrade-mainnet:
    # Base Sepolia succeeded on the same commit -> upgrade the mainnet proxies,
    # Base first, then Ethereum (max-parallel 1, fail-fast).
    needs: [guard, upgrade]
    if: needs.guard.outputs.changed == 'true' && needs.upgrade.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the RPC secret read
    concurrency:
      group: evm-mainnet-upgrade-${{ matrix.network }}
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - network: base
            proxy_var: V4_PROXY_BASE
            rpc_secret: base-mainnet-rpc-url
            chain_id: '8453'
          - network: ethereum
            proxy_var: V4_PROXY_ETHEREUM
            rpc_secret: eth-mainnet-rpc-url
            chain_id: '1'
    defaults:
      run:
        working-directory: evm
    env:
      V4_PROXY: ${{ vars[matrix.proxy_var] }}
      # Same funded owner key as the testnet leg (see deploy-evm-mainnet.yml);
      # a dedicated EVM_MAINNET_DEPLOYER wins if one is ever configured.
      DEPLOYER_PK: ${{ secrets.EVM_MAINNET_DEPLOYER || secrets.EVM_TESTNET_DEPLOYER }}
      IMPL_SLOT: '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      - name: Mainnet allowlist guard
        run: bash ../scripts/check-mainnet-allowlist.sh ${{ matrix.proxy_var }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read keyed RPC and check chain id
        run: |
          set -euo pipefail
          RPC="$(gcloud secrets versions access latest --secret=${{ matrix.rpc_secret }})"
          test -n "$RPC" || { echo "::error::${{ matrix.rpc_secret }} is empty"; exit 1; }
          echo "::add-mask::$RPC"
          echo "RPC=$RPC" >> "$GITHUB_ENV"
          got="$(cast chain-id --rpc-url "$RPC")"
          test "$got" = "${{ matrix.chain_id }}" || { echo "::error::chain id $got != ${{ matrix.chain_id }}"; exit 1; }

      - name: Pre-flight (proxy, owner, snapshot)
        run: |
          set -euo pipefail
          test -n "$V4_PROXY" || { echo "::error::${{ matrix.proxy_var }} repo variable is unset"; exit 1; }
          test "$(cast codesize "$V4_PROXY" --rpc-url "$RPC")" -gt 0 || { echo "::error::no code at $V4_PROXY"; exit 1; }
          DEPLOYER="$(cast wallet address --private-key "$DEPLOYER_PK")"
          OWNER="$(cast call "$V4_PROXY" 'owner()(address)' --rpc-url "$RPC")"
          [ "${OWNER,,}" = "${DEPLOYER,,}" ] || { echo "::error::proxy owner $OWNER != deployer $DEPLOYER"; exit 1; }
          echo "OWNER_BEFORE=$OWNER" >> "$GITHUB_ENV"
          echo "IMPL_BEFORE=$(cast storage "$V4_PROXY" "$IMPL_SLOT" --rpc-url "$RPC")" >> "$GITHUB_ENV"
          echo "SEASON_BEFORE=$(cast call "$V4_PROXY" 'currentSeasonId()(uint256)' --rpc-url "$RPC")" >> "$GITHUB_ENV"
          echo "deployer balance: $(cast balance "$DEPLOYER" --ether --rpc-url "$RPC") ETH"

      - name: Simulate upgrade against live state (no broadcast)
        run: forge script script/UpgradeCoordinationGameV4.s.sol --rpc-url "$RPC" --private-key "$DEPLOYER_PK"

      - name: Broadcast upgrade
        run: forge script script/UpgradeCoordinationGameV4.s.sol --rpc-url "$RPC" --private-key "$DEPLOYER_PK" --broadcast --slow

      - name: Verify implementation moved and state is intact
        run: |
          set -euo pipefail
          IMPL_AFTER="$(cast storage "$V4_PROXY" "$IMPL_SLOT" --rpc-url "$RPC")"
          [ "$IMPL_AFTER" != "$IMPL_BEFORE" ] || { echo "::error::implementation slot unchanged"; exit 1; }
          IMPL_ADDR="0x${IMPL_AFTER:26}"
          test "$(cast codesize "$IMPL_ADDR" --rpc-url "$RPC")" -gt 0 || { echo "::error::no code at new impl $IMPL_ADDR"; exit 1; }
          OWNER="$(cast call "$V4_PROXY" 'owner()(address)' --rpc-url "$RPC")"
          [ "$OWNER" = "$OWNER_BEFORE" ] || { echo "::error::owner changed: $OWNER_BEFORE -> $OWNER"; exit 1; }
          SEASON="$(cast call "$V4_PROXY" 'currentSeasonId()(uint256)' --rpc-url "$RPC")"
          [ "$SEASON" = "$SEASON_BEFORE" ] || { echo "::error::currentSeasonId changed: $SEASON_BEFORE -> $SEASON"; exit 1; }
          echo "${{ matrix.network }}: $V4_PROXY implementation ${IMPL_BEFORE:26} -> ${IMPL_AFTER:26}"

  upgrade-xchain:
    needs: guard
    if: needs.guard.outputs.xchain_changed == 'true'
    uses: ./.github/workflows/_deploy-evm.yml
    with:
      contract: crosschain-upgrade
      network: base_sepolia
    secrets:
      EVM_TESTNET_DEPLOYER: ${{ secrets.EVM_TESTNET_DEPLOYER }}

  upgrade-xchain-mainnet:
    needs: [guard, upgrade-xchain]
    if: needs.guard.outputs.xchain_changed == 'true' && needs.upgrade-xchain.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: evm-xchain-mainnet-upgrade-${{ matrix.network }}
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - network: base
            proxy_var: XCHAIN_PROXY_BASE
            rpc_secret: base-mainnet-rpc-url
            chain_id: '8453'
          - network: ethereum
            proxy_var: XCHAIN_PROXY_ETHEREUM
            rpc_secret: eth-mainnet-rpc-url
            chain_id: '1'
    defaults:
      run:
        working-directory: evm
    env:
      XCHAIN_PROXY: ${{ vars[matrix.proxy_var] }}
      DEPLOYER_PK: ${{ secrets.EVM_MAINNET_DEPLOYER || secrets.EVM_TESTNET_DEPLOYER }}
      IMPL_SLOT: '0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      - name: Mainnet allowlist guard
        run: bash ../scripts/check-mainnet-allowlist.sh ${{ matrix.proxy_var }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Read keyed RPC and check chain id
        run: |
          set -euo pipefail
          RPC="$(gcloud secrets versions access latest --secret=${{ matrix.rpc_secret }})"
          test -n "$RPC" || { echo "::error::${{ matrix.rpc_secret }} is empty"; exit 1; }
          echo "::add-mask::$RPC"
          echo "RPC=$RPC" >> "$GITHUB_ENV"
          got="$(cast chain-id --rpc-url "$RPC")"
          test "$got" = "${{ matrix.chain_id }}" || { echo "::error::chain id $got != ${{ matrix.chain_id }}"; exit 1; }

      - name: Pre-flight (proxy, owner, snapshot)
        run: |
          set -euo pipefail
          test -n "$XCHAIN_PROXY" || { echo "::error::${{ matrix.proxy_var }} repo variable is unset"; exit 1; }
          test "$(cast codesize "$XCHAIN_PROXY" --rpc-url "$RPC")" -gt 0 || { echo "::error::no code at $XCHAIN_PROXY"; exit 1; }
          DEPLOYER="$(cast wallet address --private-key "$DEPLOYER_PK")"
          OWNER="$(cast call "$XCHAIN_PROXY" 'owner()(address)' --rpc-url "$RPC")"
          [ "${OWNER,,}" = "${DEPLOYER,,}" ] || { echo "::error::proxy owner $OWNER != deployer $DEPLOYER"; exit 1; }
          echo "OWNER_BEFORE=$OWNER" >> "$GITHUB_ENV"
          echo "IMPL_BEFORE=$(cast storage "$XCHAIN_PROXY" "$IMPL_SLOT" --rpc-url "$RPC")" >> "$GITHUB_ENV"
          echo "STAKE_BEFORE=$(cast call "$XCHAIN_PROXY" 'stakeWei()(uint128)' --rpc-url "$RPC")" >> "$GITHUB_ENV"
          echo "deployer balance: $(cast balance "$DEPLOYER" --ether --rpc-url "$RPC") ETH"

      - name: Simulate upgrade against live state (no broadcast)
        run: forge script script/UpgradeCrossChainGame.s.sol --rpc-url "$RPC" --private-key "$DEPLOYER_PK"

      - name: Broadcast upgrade
        run: forge script script/UpgradeCrossChainGame.s.sol --rpc-url "$RPC" --private-key "$DEPLOYER_PK" --broadcast --slow

      - name: Verify implementation moved and state is intact
        run: |
          set -euo pipefail
          IMPL_AFTER="$(cast storage "$XCHAIN_PROXY" "$IMPL_SLOT" --rpc-url "$RPC")"
          [ "$IMPL_AFTER" != "$IMPL_BEFORE" ] || { echo "::error::implementation slot unchanged"; exit 1; }
          IMPL_ADDR="0x${IMPL_AFTER:26}"
          test "$(cast codesize "$IMPL_ADDR" --rpc-url "$RPC")" -gt 0 || { echo "::error::no code at new impl $IMPL_ADDR"; exit 1; }
          OWNER="$(cast call "$XCHAIN_PROXY" 'owner()(address)' --rpc-url "$RPC")"
          [ "$OWNER" = "$OWNER_BEFORE" ] || { echo "::error::owner changed: $OWNER_BEFORE -> $OWNER"; exit 1; }
          STAKE="$(cast call "$XCHAIN_PROXY" 'stakeWei()(uint128)' --rpc-url "$RPC")"
          [ "$STAKE" = "$STAKE_BEFORE" ] || { echo "::error::stakeWei changed: $STAKE_BEFORE -> $STAKE"; exit 1; }
          echo "${{ matrix.network }}: $XCHAIN_PROXY implementation ${IMPL_BEFORE:26} -> ${IMPL_AFTER:26}"
