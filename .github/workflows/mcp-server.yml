name: MCP Server & Shared Crates

on:
  workflow_dispatch: {} # manual trigger (e.g. redeploy after a workflow-only fix)
  push:
    branches: [main]
    paths:
      - 'services/mcp-server/**'
      - 'crates/game-api-client/**'
      - 'crates/game-chain/**'
      # The MCP server builds cross-chain calldata from these crates, so a
      # registry address change or chain-seam edit must redeploy it.
      - 'crates/chain-registry/**'
      - 'crates/chain-core/**'
      - 'crates/evm-chain/**'
      - 'infra/k8s/mcp-server/**'
  pull_request:
    paths:
      - 'services/mcp-server/**'
      - 'crates/game-api-client/**'
      - 'crates/game-chain/**'
      - 'crates/chain-registry/**'
      - 'crates/chain-core/**'
      - 'crates/evm-chain/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: github.ref == 'refs/heads/main'

      - name: Configure Docker for Artifact Registry
        if: github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and test
        uses: docker/build-push-action@v6
        with:
          file: services/mcp-server/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            us-central1-docker.pkg.dev/coordination-game-prod/backend/mcp-server:${{ github.sha }}
            us-central1-docker.pkg.dev/coordination-game-prod/backend/mcp-server:latest

      # Cloud Run deploy (mcp-server migrated off GKE). Only --image changes; the
      # rest of the service config (env, VPC, scaling) is Terraform-managed in
      # coordination-app/infra/cloudrun.tf with lifecycle ignore_changes on the
      # image, so this update-in-place is safe. Mirrors game-api.yml. The old
      # Get-GKE-credentials + kubectl steps broke when the migration destroyed the
      # cluster, freezing mcp-server at its first revision.
      - name: Deploy to Cloud Run
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud run deploy mcp-server \
            --image us-central1-docker.pkg.dev/coordination-game-prod/backend/mcp-server:${{ github.sha }} \
            --region us-central1 \
            --quiet
