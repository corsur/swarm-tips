name: MCP Server & Shared Crates

on:
  push:
    branches: [main]
    paths:
      - 'services/mcp-server/**'
      - 'crates/game-api-client/**'
      - 'crates/api-transport/**'
      - '.github/workflows/mcp-server.yml'
      - 'crates/game-chain/**'
      - 'crates/shillbot-chain/**'
      - 'sdk/client/**'
      - 'docs/specs/shillbot-transaction-intent-v1.schema.json'
      # The MCP server builds cross-chain calldata from these crates, so a
      # registry address change or chain-seam edit must redeploy it.
      - 'crates/chain-registry/**'
      - 'crates/chain-core/**'
      - 'crates/evm-chain/**'
      - 'infra/k8s/mcp-server/**'
  pull_request:
    paths:
      - 'services/mcp-server/**'
      - 'crates/game-api-client/**'
      - 'crates/api-transport/**'
      - '.github/workflows/mcp-server.yml'
      - 'crates/game-chain/**'
      - 'crates/chain-registry/**'
      - 'crates/chain-core/**'
      - 'crates/evm-chain/**'
      - 'sdk/client/**'
  workflow_dispatch:

# Only the newest commit for a branch may deploy. Without this, a slower older
# image can finish after a newer build and temporarily roll Cloud Run backward.
concurrency:
  group: mcp-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: github.ref == 'refs/heads/main'

      - name: Configure Docker for Artifact Registry
        if: github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and test
        uses: docker/build-push-action@v6
        with:
          file: services/mcp-server/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            us-central1-docker.pkg.dev/coordination-game-prod/backend/mcp-server:${{ github.sha }}
            us-central1-docker.pkg.dev/coordination-game-prod/backend/mcp-server:latest

      # Production image updates are owned by coordination-app's release
      # workflow. This public workflow only builds, tests and publishes the
      # independently runnable MCP image; it cannot overwrite the combined service.
