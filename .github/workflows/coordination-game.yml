name: Coordination Game

on:
  push:
    branches: [main]
    paths:
      - 'programs/coordination-game/**'
      - 'crates/shared/**'
      - 'tests/coordination-game.ts'
      - 'tests/xchain-contested.ts'
      - 'tests/game-harness.ts'
      - 'tests/timeout-harness.ts'
      - 'tests/harness/**'
      - 'tests/helpers/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'Anchor.toml'
      - '.github/workflows/coordination-game.yml'
      - 'sdk/**'
  pull_request:
    paths:
      - 'programs/coordination-game/**'
      - 'crates/shared/**'
      - 'tests/coordination-game.ts'
      - 'tests/xchain-contested.ts'
      - 'tests/game-harness.ts'
      - 'tests/timeout-harness.ts'
      - 'tests/harness/**'
      - 'tests/helpers/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'Anchor.toml'
      - '.github/workflows/coordination-game.yml'
      - 'sdk/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target cluster (mainnet requires explicitly selecting it)'
        required: true
        default: devnet
        type: choice
        options:
          - devnet
          - mainnet

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt -p coordination-game --check
      - run: cargo clippy -p coordination-game --all-targets -- -D warnings

      - name: Generate throwaway keypair for local validator
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json

      - name: Build programs
        run: |
          anchor build -p coordination-game
          anchor build -p shillbot
          # startAnchor(".") in the bankrun step loads EVERY program declared in
          # Anchor.toml [programs.localnet]; a missing .so panics
          # solana-program-test on a background thread and hangs the test hook.
          anchor build -p extension-registry
          anchor build -p extension-credit

      - name: Lint coordination-game tests
        run: npx prettier "tests/coordination-game.ts" "tests/xchain-contested.ts" "tests/game-harness.ts" "tests/timeout-harness.ts" --check

      # Harness bankrun suites — in-process, no validator. The cross-chain
      # contested path warps the clock past the claim window (a live validator
      # can't do that deterministically); the same-chain harness plays the payoff
      # cells through the modular steps + property battery.
      # --exit: bankrun's native context keeps libuv's event loop alive, so
      # mocha hangs after the tests pass unless forced to exit.
      - name: Run harness bankrun tests
        run: npx ts-mocha -p ./tsconfig.json -t 1000000 --exit "tests/xchain-contested.ts" "tests/game-harness.ts" "tests/timeout-harness.ts"

      - name: Start local validator
        run: |
          solana-test-validator \
            --bpf-program 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P target/deploy/coordination_game.so \
            --bpf-program 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi target/deploy/shillbot.so \
            --reset --quiet &
          sleep 5
          solana config set --url localhost --keypair /home/runner/.config/solana/id.json
          solana airdrop 100

      - name: Run coordination-game tests
        # xchain.ts covers the UNCONTESTED Solana cross-chain path
        # (create_xmatch → lock → settle_xmatch + refunds) against the local
        # validator — the contested path runs under bankrun above. It was
        # previously wired into no workflow (orphaned), so the happy-path
        # settle had zero CI coverage.
        run: npx ts-mocha -p ./tsconfig.json -t 1000000 "tests/coordination-game.ts" "tests/xchain.ts"
        env:
          ANCHOR_PROVIDER_URL: http://localhost:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json

      - name: Stop local validator
        if: always()
        run: pkill -f solana-test-validator || true

  deploy-devnet:
    # workflow_dispatch with target=devnet (the default). Never on push.
    # Manual only — conserve the rate-limited devnet faucet. See MAINNET_DEPLOY.md.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'devnet'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - run: pnpm install --frozen-lockfile

      - name: Write deploy keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json

      - name: Write program keypairs
        run: |
          mkdir -p target/deploy
          echo '${{ secrets.ANCHOR_PROGRAM_KEYPAIR }}' > target/deploy/coordination_game-keypair.json
          echo '${{ secrets.SHILLBOT_PROGRAM_KEYPAIR }}' > target/deploy/shillbot-keypair.json

      - name: Build programs
        run: |
          anchor build -p coordination-game
          anchor build -p shillbot

      - name: Close orphaned buffer accounts
        run: solana program close --buffers --url devnet --keypair ~/.config/solana/id.json || true

      - name: Close IDL accounts (required when IDL size increases)
        run: |
          anchor idl close --provider.cluster devnet 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P || true
          anchor idl close --provider.cluster devnet 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi || true

      - name: Deploy both programs to devnet
        # Use `solana program deploy` directly instead of `anchor deploy`.
        # The latter bundles bytecode upload with an idl upgrade that fails
        # on devnet with 0xbc4 / AccountNotInitialized when the on-chain IDL
        # is in an inconsistent state — the prior `anchor idl close` step
        # silently fails for both programs (`|| true`) and leaves the IDL
        # account stuck. The IDL stick caused the 2026-05-09 gameplay E2E
        # outage: devnet bytecode drifted from mainnet because deploy CI
        # had been failing on the IDL step for weeks, accounts created with
        # the new IDL failed to deserialize on-chain. Bypass the IDL step
        # so bytecode keeps flowing; IDL is best-effort below.
        run: |
          solana program deploy \
            --url https://api.devnet.solana.com \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P \
            target/deploy/coordination_game.so
          solana program deploy \
            --url https://api.devnet.solana.com \
            --upgrade-authority ~/.config/solana/id.json \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi \
            target/deploy/shillbot.so

      # Same reason as the mainnet job: a struct change is not live until its
      # migration has run, and separating them is what broke mainnet. Idempotent.
      - name: Migrate + reconcile GlobalConfig
        env:
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL_DEVNET }}
        run: |
          set -euo pipefail
          # No toolchain setup here on purpose: this job already ran
          # pnpm/action-setup, setup-node and `pnpm install --frozen-lockfile`
          # before building. Re-adding them is what caused every failure on this
          # step — npm against a pnpm tree, then a second pnpm/action-setup with
          # no version. Just use what the job already has.
          pnpm dlx tsx scripts/reconcile-solana-stake.ts --cluster devnet --apply

      - name: Initialize / upgrade on-chain IDL (best effort)
        # Off-chain consumers use the SDK's bundled IDL, not the on-chain
        # copy, so the program runs correctly even if these calls fail.
        run: |
          (anchor idl init --provider.cluster devnet \
            --filepath target/idl/coordination_game.json \
            2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P || \
           anchor idl upgrade --provider.cluster devnet \
            --filepath target/idl/coordination_game.json \
            2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P) || \
          echo "coordination_game IDL update failed; bytecode is the load-bearing step"
          (anchor idl init --provider.cluster devnet \
            --filepath target/idl/shillbot.json \
            2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi || \
           anchor idl upgrade --provider.cluster devnet \
            --filepath target/idl/shillbot.json \
            2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi) || \
          echo "shillbot IDL update failed; bytecode is the load-bearing step"

      - name: Verify program parity across mainnet and devnet
        # Catches the same drift that caused this CI fix in the first place.
        # Fails CI if devnet bytecode falls out of sync with mainnet again.
        run: bash scripts/check-program-parity.sh

      - name: Verify upgrade authority (post-deploy)
        run: |
          bash scripts/check-upgrade-authority.sh \
            --cluster devnet \
            --program-id 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P
          bash scripts/check-upgrade-authority.sh \
            --cluster devnet \
            --program-id 2tR37nqMpwdV4DVUHjzUmL1rH2DtkA8zrRA4EAhT7KMi
        env:
          EXPECTED_AUTHORITY_PUBKEY: CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY

      - name: Publish SDK to GitHub Packages
        run: |
          cp target/types/coordination_game.ts sdk/coordination_game.ts
          node -e "
            const idl = require('./target/idl/coordination_game.json');
            const fs = require('fs');
            fs.appendFileSync('sdk/coordination_game.ts',
              '\nexport const IDL: CoordinationGame = ' + JSON.stringify(idl, null, 2) + ' as unknown as CoordinationGame;\n'
            );
          "
          cp target/types/shillbot.ts sdk/shillbot.ts
          node -e "
            const idl = require('./target/idl/shillbot.json');
            const fs = require('fs');
            fs.appendFileSync('sdk/shillbot.ts',
              '\nexport const IDL: Shillbot = ' + JSON.stringify(idl, null, 2) + ' as unknown as Shillbot;\n'
            );
          "
          # Compile TypeScript to JavaScript for Node.js consumers
          cd sdk
          npx tsc coordination_game.ts --outDir . --declaration --module nodenext --moduleResolution nodenext --target es2020 --esModuleInterop
          # Use ${{ github.run_number }} for the patch version. The previous
          # `git rev-list --count HEAD` formula always returned 1 because
          # actions/checkout's default fetch-depth is 1 (shallow), so every
          # push produced version 0.1.1 and the second publish onward hit
          # `npm error 409 Cannot publish over existing version`. The first
          # publish landed 2026-04-02; every CG run since has been red on
          # this single step. github.run_number is monotonic across all runs
          # of this workflow, guaranteed unique, no shallow-clone gotcha.
          npm version 0.1.${{ github.run_number }} --no-git-tag-version
          npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_PACKAGES }}

      # Publishing was never the broken half. The frontend's lockfile pinned
      # 0.1.1 — the FIRST publish, 2026-04-02 — and nothing moved it, so four
      # months of program changes never reached the app: 22 instructions shipped
      # against the program's 39. It caused no outage, which is exactly why it
      # went unnoticed; the cost was a silently impossible feature. The IDL's
      # `depositStake` has no `global_config` account, so the client cannot pass
      # one, so the Solana stake cannot be raised to the $5 anchor. That was
      # diagnosed for most of a day as a program-side constraint. It was a stale
      # npm package.
      #
      # This closes the loop: coordination-app's sdk-bump.yml moves the frontend
      # onto the version just published, gates it on tsc + vitest, and pushes,
      # which triggers the frontend deploy.
      - name: Propagate the SDK to coordination-app
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PACKAGES }}
        run: |
          set -euo pipefail
          # Loud on failure, deliberately. A published-but-unpropagated SDK is
          # the precise state that hid for four months, so it must not be a
          # notice the reader scrolls past — the deploy above has already
          # succeeded, and this red means "shipped, but the app has not moved".
          gh api "repos/corsur/coordination-app/dispatches" \
            -f event_type=sdk-published \
            -f "client_payload[version]=0.1.${{ github.run_number }}" \
            || { echo "::error::SDK 0.1.${{ github.run_number }} published but the coordination-app dispatch FAILED — the frontend is now behind the deployed program. Check that GH_PAT_PACKAGES still carries repo scope for corsur/coordination-app, then re-run sdk-bump.yml manually with that version."; exit 1; }

  deploy-mainnet:
    # Auto-upgrades mainnet on every merge to main, plus manual dispatch.
    # Safe to automate specifically BECAUSE Solana programs are upgradeable:
    # `solana program deploy` against an existing program ID replaces the
    # bytecode in place, preserving the program address and every PDA's state.
    # A merge therefore upgrades; it never orphans accounts or funds.
    # Gated on `needs: test`, so a red test suite blocks the upgrade.
    if: >-
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'mainnet'))
    environment: mainnet
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked

      - name: Write deploy keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json

      - name: Write program keypairs
        run: |
          mkdir -p target/deploy
          echo '${{ secrets.ANCHOR_PROGRAM_KEYPAIR }}' > target/deploy/coordination_game-keypair.json

      - name: Build coordination game only
        # `--features mainnet` selects the mainnet Solana chain tag in
        # solana_chain_tag() (cross-chain leg-A binding). MUST be present on
        # every mainnet build — without it, cross-chain settlement breaks with
        # XCertMismatch. See MAINNET_DEPLOY.md.
        run: anchor build -p coordination-game -- --features mainnet

      - name: Deploy coordination game to mainnet
        run: anchor deploy -p coordination_game --provider.cluster mainnet
      # A struct change is not live until its migration has run. Doing this in a
      # SEPARATE workflow is what broke mainnet on 2026-08-03: the deploy fired
      # on merge, the migration had no trigger, and the new program sat against
      # a 107-byte GlobalConfig failing AccountDidNotDeserialize on every
      # instruction that touches it — create_game included.
      #
      # Reuses this job's already-proven toolchain (rust, libudev, solana,
      # anchor, keypair, and the IDL that `anchor build` just emitted). The
      # script is idempotent: it skips the migration when already applied and
      # skips the stake write when it already matches the registry.
      # deploy-mainnet, unlike deploy-devnet and test, does NOT set up pnpm
      # earlier in the job — so this step needs it. (Removing my duplicated
      # setup was right for devnet and wrong here; the two jobs are not
      # symmetric, and I treated them as if they were.)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Migrate + reconcile GlobalConfig
        env:
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL_MAINNET }}
        run: |
          set -euo pipefail
          # No toolchain setup here on purpose: this job already ran
          # pnpm/action-setup, setup-node and `pnpm install --frozen-lockfile`
          # before building. Re-adding them is what caused every failure on this
          # step — npm against a pnpm tree, then a second pnpm/action-setup with
          # no version. Just use what the job already has.
          pnpm dlx tsx scripts/reconcile-solana-stake.ts --cluster mainnet --apply


      - name: Verify upgrade authority (mainnet)
        run: |
          bash scripts/check-upgrade-authority.sh \
            --cluster mainnet-beta \
            --program-id 2qqVk7kUqffnahiJpcQJCsSd8ErbEUgKTgCn1zYsw64P
        env:
          EXPECTED_AUTHORITY_PUBKEY: CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY
