name: Reconcile Solana Stake

# The Solana half of stake infrastructure-as-code, mirroring Reconcile EVM Stake.
#
# `crates/chain-registry` declares the desired stake; this converges the chain to
# it. Two idempotent steps:
#   1. migrate_global_config — grows the singleton GlobalConfig 107 -> 115 bytes
#      so it can carry stake_lamports. Skipped once already migrated.
#   2. set_stake_lamports — writes the registry's value. Skipped when it matches.
#
# WHY THIS EXISTS: the Solana stake used to be a compile-time constant, so
# re-pegging meant shipping a program while every EVM chain re-pegged with a
# transaction. Solana consequently sat at 0.05 SOL ($3.64) against a $5 EVM
# anchor — the cheap change got made, the expensive one did not. Making both
# sides equally cheap is the actual fix; the tests only detect the divergence.
#
# ORDERING: runs after "Coordination Game" succeeds, because the instructions it
# calls only exist once the upgraded program is deployed. Running it before that
# is a no-op that reports the migration as still needed.
# NOTE: the deploy path handles itself. coordination-game.yml runs this same
# script immediately after `anchor deploy`, so a program upgrade and its
# migration are ONE job and cannot be separated. This workflow covers the other
# case: a registry-only re-peg with no program change.
on:
  push:
    branches: [main]
    paths:
      - 'crates/chain-registry/src/lib.rs'
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster to reconcile'
        required: true
        type: choice
        options: [devnet, mainnet]
        default: devnet

concurrency:
  group: reconcile-solana-stake
  cancel-in-progress: false

jobs:
  reconcile:
    # `push` was added as a trigger but never to this condition, so every
    # registry change SKIPPED the job silently — a workflow that looks wired
    # and does nothing. workflow_run is no longer a trigger (the deploy job
    # reconciles inline), so only push and dispatch remain.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A registry edit is a statement about EVERY cluster it declares, so a push
    # must converge all of them. It used to reconcile only devnet: `push` leaves
    # `inputs.cluster` empty and the run step defaulted to devnet. That is how
    # Solana mainnet was left at the $5 anchor after devnet was pinned back to
    # 0.05 SOL, which made the mainnet game unplayable (deposit at the client's
    # 0.05, then create_game rejects it with StakeMismatch). The same shape as
    # the `if:` gate that silently skipped every run: a job that looks wired to
    # the registry and only half-acts on it.
    strategy:
      # Serial: two clusters signed by the same authority key, and a shared
      # nonce makes concurrent sends flaky for no gain at this size.
      max-parallel: 1
      fail-fast: false
      matrix:
        cluster: ${{ fromJSON(github.event_name == 'push' && '["devnet","mainnet"]' || format('["{0}"]', github.event.inputs.cluster)) }}
    environment: ${{ (matrix.cluster == 'mainnet') && 'mainnet' || 'testnet' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' 

      # The IDL is a build artifact under target/ and is GITIGNORED, so it does
      # not exist on a fresh checkout. The reconcile script loads it to build
      # its instruction calls, so without this the workflow fails on a missing
      # file — not on anything to do with the chain.
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps for anchor-cli
        # anchor-cli links against libudev; without it the cargo install fails
        # with "Package 'libudev' ... not found". Same line as coordination-game.yml.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Anchor
        # Pinned to the version the program's Cargo.toml resolves (0.32.1), the
        # same line coordination-game.yml uses. `avm install latest` failed:
        # anchor refuses to build an IDL with a CLI that does not match the
        # anchor-lang dep.
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked
      - name: Generate the IDL
        working-directory: programs/coordination-game
        run: |
          set -euo pipefail
          # anchor writes the file but will NOT create the directory; on a fresh
          # checkout target/idl does not exist and it fails with a bare
          # "No such file or directory". It worked locally only because the dir
          # was left over from an earlier build.
          mkdir -p ../../target/idl
          anchor idl build -o ../../target/idl/coordination_game.json
          test -s ../../target/idl/coordination_game.json

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Write the authority keypair
        env:
          KEYPAIR: ${{ secrets.SOLANA_DEPLOY_KEYPAIR }}
        run: |
          set -euo pipefail
          [ -n "$KEYPAIR" ] || { echo "::error::SOLANA_DEPLOY_KEYPAIR is not set"; exit 1; }
          mkdir -p ~/.config/solana
          printf '%s' "$KEYPAIR" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Reconcile
        env:
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
          DEVNET_RPC: ${{ secrets.SOLANA_RPC_URL_DEVNET }}
          MAINNET_RPC: ${{ secrets.SOLANA_RPC_URL_MAINNET }}
        run: |
          set -euo pipefail
          CLUSTER="${{ matrix.cluster }}"
          # No silent default. An empty cluster here would reconcile SOMETHING
          # against the wrong chain rather than stopping, and the matrix always
          # supplies one.
          [ -n "$CLUSTER" ] || { echo "::error::matrix.cluster is empty"; exit 1; }
          # Per-cluster endpoint. Exporting the DEVNET url unconditionally made a
          # mainnet run read devnet state and "reconcile" against the wrong chain.
          if [ "$CLUSTER" = "mainnet" ]; then
            export SOLANA_RPC_URL="${MAINNET_RPC:-https://api.mainnet-beta.solana.com}"
          else
            export SOLANA_RPC_URL="${DEVNET_RPC:-https://api.devnet.solana.com}"
          fi
          pnpm dlx tsx scripts/reconcile-solana-stake.ts --cluster "$CLUSTER" --apply

      - name: Report
        if: always()
        run: echo "### Reconciled Solana stake on ${{ matrix.cluster }}" >> "$GITHUB_STEP_SUMMARY"
