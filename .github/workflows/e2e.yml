name: Reputation E2E (devnet)

# Automated, SOL-FREE end-to-end test of the reputation / credit-web path. This
# is the AGENT-facing e2e: agents consume swarm.tips through the MCP server, so
# it boots the real mcp-server pointed at devnet and drives the /mcp transport
# (not a browser), asserting READ-ONLY against the permanent dogfood extension
# on devnet. It creates no on-chain state and spends NO SOL — safe to run on
# every push. The write path (submit/attest/default + bond conservation) is
# covered by the program's free localnet anchor tests.
#
# Requires (repo settings): vars.GCP_WORKLOAD_IDENTITY_PROVIDER /
# vars.GCP_SERVICE_ACCOUNT — so the mcp-server boots its Firestore client via
# ADC at startup (the reputation tools themselves read devnet directly). No
# wallet/secret needed; nothing is signed.

on:
  push:
    branches: [main]
    paths:
      - 'programs/extension-registry/**'
      - 'programs/extension-credit/**'
      - 'services/mcp-server/**'
      - 'scripts/e2e/mcp-reputation-devnet.ts'
      - 'scripts/e2e/run-mcp-reputation-devnet.sh'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: reputation-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-reputation-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run the MCP reputation e2e (boots devnet server, drives /mcp read-only, tears down)
        run: bash scripts/e2e/run-mcp-reputation-devnet.sh
        env:
          GCP_PROJECT_ID: coordination-game-prod
