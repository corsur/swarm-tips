name = "lproofs"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Lproofs"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "Lproofs"
# Build the whole tree (infra + every per-problem certificate under Lproofs/Problems), so a bare
# `lake build` compiles and checks all certificates — matching the reproducibility claim.
globs = ["Lproofs.+"]

[[lean_exe]]
name = "gate"
root = "Gate"
# The mechanical genuineness gate: recomputes per-problem certificate verdicts from the elaborated
# environment (sol-reference, closed test vectors, standard-axiom closure). Run: `lake exe gate`.
