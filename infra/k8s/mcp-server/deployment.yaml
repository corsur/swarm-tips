apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: swarm-tips
spec:
  # replicas is intentionally omitted — the KEDA ScaledObject
  # (scaled-object.yaml, min 2 / max 5) owns the replica count. Setting it
  # here would fight KEDA on every kubectl apply.
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: swarm-tips
      terminationGracePeriodSeconds: 300
      containers:
        - name: mcp-server
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          image: us-central1-docker.pkg.dev/coordination-game-prod/backend/mcp-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # EigenTrust pre-trust anchor set for /internal/reputation/rebuild
            # (comma-separated wallets; trust originates only here). Not a
            # secret — a public wallet address.
            - name: REPUTATION_ANCHORS
              value: "CKsZ7ZMLLUzbHUeu2Vm5mjuB8QQi3vfvqvXFdFxT7xmY"
          envFrom:
            - configMapRef:
                name: swarm-tips-config
          # Runtime secrets (xai-api-key, solana-rpc-url-{network}) come from
          # GCP Secret Manager DIRECTLY via gcloud-sdk at startup — see
          # src/config.rs::load_optional_secret. No K8s Secret bridge.
          # See `swarm/CLAUDE.md` "Three secret categories, three homes".
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Readiness = the dependency check (/ready hits game-api + Solana RPC,
          # up to ~4s). A failing dependency drains traffic from this pod; it does
          # NOT kill it. timeoutSeconds must exceed the handler's worst case.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness = trivial /health (no outbound calls). Only a truly hung
          # process fails this — a slow game-api/RPC never kills a healthy pod
          # (the previous /health-with-deps + default 1s timeout was the Exit-137
          # restart loop).
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
