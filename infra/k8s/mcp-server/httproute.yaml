apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-server
  namespace: swarm-tips
spec:
  parentRefs:
    - name: unified-backend-gateway
      namespace: swarm-tips
  hostnames:
    - mcp.shillbot.org
    - mcp.coordination.game
    - mcp.swarm.tips
  rules:
    # Route to the KEDA HTTP add-on interceptor (same namespace) so mcp-server
    # can idle at 0 and wake on the first request. The interceptor matches the
    # mcp.* hosts to the mcp-server HTTPScaledObject (scaled-object.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          port: 8080
