[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# Cross-chain certs are large calldata structs; via-IR avoids stack-too-deep
# in the settle/claim verification paths and is the modern default.
via_ir = true
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 32 }
# Golden cert vectors authored by chain-core live one level up.
fs_permissions = [{ access = "read", path = "../tests/fixtures" }]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
# Mainnet aliases (public endpoints). Public RPCs rate-limit broadcasts — the
# gated mainnet deploy should pass a keyed URL via the EVM_MAINNET_RPC_URL secret
# (overrides these). The CAIP-2 chain ids are eip155:8453 (base) / eip155:1 (ethereum).
base = "https://mainnet.base.org"
ethereum = "https://ethereum-rpc.publicnode.com"
